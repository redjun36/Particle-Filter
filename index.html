<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Depth Particle — MEP Interactive</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; font-family: 'Courier New', monospace; }
    canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; }

    /* ─── Two explicit per-display layouts ─────────────────────────────────
       Portrait (default below) targets the 9:16 vertical monitor/mobile
       case; landscape overrides it for the 16:9 general-web case. Kept as
       separate variable sets (not one shared vmin formula) so either can be
       retuned later without touching the other. */
    :root {
      /* Sized against the 9:16 wireframe's own ratios (logo/slogan/hand-guide
         measured relative to the ring square's width), not an arbitrary vmin
         guess — components read much bigger there than our old values. */
      --attract-logo-w: 50vmin;
      --attract-guide-gap: 2.5vmin;
      --attract-guide-text-w: 60vmin; /* 120% of 50vmin */
      --attract-anim-w: 78vmin;
      --attract-guide-bottom: 4vmin;
      --ring-radius-ratio: 0.36;
      /* Small breathing room between the dot-ring square and the guide block
         below it — kept modest now that the guide block itself (bigger text
         + bigger hand-gesture strip) already reserves plenty of space, so
         adding much more here just reads as a big empty gap. */
      --attract-ring-gap: 1.5vmin;
      /* Height of the guide-text + hand-gesture block (2 text lines + gap +
         guide-animation strip + its own bottom margin + the ring gap above
         it), derived from the vars above so it always matches whatever either
         breakpoint sets them to. #attract (dot ring + logo + tagline) is
         reserved everything ABOVE this band — see #attract's `bottom` below
         — so the two blocks never overlap. */
      --attract-guide-total-h: calc(
        (var(--attract-guide-text-w) * 69 / 824) + var(--attract-guide-gap) +
        (var(--attract-anim-w) * 65 / 96) + var(--attract-guide-bottom) +
        var(--attract-ring-gap)
      );
      /* Live camera/trail view (arming/drawing/countdown/capturing) is framed
         to a fixed 900:1350 (2:3) portrait "photo" ratio instead of filling
         the screen — same proportions in both orientations for now, since
         it's meant to read as a fixed photo shape rather than a layout that
         fills whatever space is available. */
      --frame-w: 83.33vmin; /* 900/1080 of screen width, per the latest mockup (900x1350 @ 1080x1920 ref) */
      --frame-h: calc(var(--frame-w) * 3 / 2);
      --frame-top: 8.33vmin;
      /* Fixed corner radius (not a full pill anymore) — 188px out of the
         mockup's 900px-wide frame, kept as a ratio so it scales with
         --frame-w instead of a hardcoded vmin value. */
      --frame-radius: calc(var(--frame-w) * 188 / 900);
      /* Colored-dot "every else" graphic below the frame — gap decomposed
         from the exact Figma readout (frame-top 8.33 + frame-h 125 +
         9.17 = 142.5vmin) so it stays correct if frame-w/-top ever change. */
      --dots-gap: 9.17vmin;
      --dots-w: 49.07vmin;

      /* QR result screen */
      --qr-gap: 9vmin; /* 3x the original 3vmin, between thumb/QR box/text group */
      --qr-text-gap: 3vmin; /* 1/3 of --qr-gap */
      --qr-thumb-w: 46vmin;
      --qr-code-w: 26vmin;
      --qr-instruction-w: 38vmin;
      --qr-return-w: 62vmin;

      /* Onboarding tutorial overlay — proportions read off the Figma mockup's
         1080x1920 reference frame (342px top margin, ~226px gap, 132px bottom
         margin), converted to vmin against that frame's own 1080px width
         (vmin == width in a 9:16 viewport, so pxValue/1080*100 == vmin). */
      --tutorial-top: 31.7vmin;
      --tutorial-gap: 21vmin;
      --tutorial-bottom: 12.2vmin;
      --tutorial-logo-w: 50vmin;
      --tutorial-video-w: 80vmin; /* 80% of full screen width; still square (native 3840x3840) */
      --tutorial-text-w: 75vmin;
      /* Bottom instruction text is pinned here regardless of the video's own
         size (see #tutorialText) — kept at the spot it landed at under the
         video's original 52vmin size, since widening the video to full
         screen width is fine to overlap under the text. */
      --tutorial-text-top: calc(
        var(--tutorial-top) + (var(--tutorial-logo-w) * 195 / 544) +
        var(--tutorial-gap) + 52vmin + var(--tutorial-gap)
      );
      /* Manual px nudges from live tuning earlier this session — kept as
         vars so landscape can start from a clean 0px instead of inheriting
         portrait-specific pixel offsets. */
      --tutorial-video-nudge-y: -290px;
      --tutorial-text-nudge-y: 190px;
    }
    @media (orientation: landscape) {
      :root {
        --attract-logo-w: 22vmin;
        --attract-guide-gap: 2.2vmin;
        --attract-guide-text-w: 54vmin; /* 2x of 27vmin */
        --attract-anim-w: 46vmin;
        --attract-guide-bottom: 4vmin;
        --ring-radius-ratio: 0.30;
        /* Landscape wireframe has the guide block sitting right against the
           ring square, so no extra gap here. */
        --attract-ring-gap: 0vmin;

        /* ─── 16:9 landscape rough first pass — eyeballed against the 3-panel
           mockup, not a precise Figma readout like the portrait values above.
           Expect to retune these like everything else in this file. */
        /* Inverted from portrait's 900:1350 (2:3, taller-than-wide) to
           1350:900 (3:2, wider-than-tall) — the captured photo follows
           automatically since compositeCapture() just reads the canvas's
           own W/H. --frame-h is redeclared here (not just --frame-w) to
           avoid a circular var() reference with the base :root's
           `--frame-h: calc(var(--frame-w) * 3 / 2)`.
           Exact Figma readout (@3839x2160 landscape ref): top gap 113,
           pill 2289.5x1526.33, gap-to-dots 113, dot row height 294.75
           (width derived from its own 2120:882 aspect), bottom margin
           112.92 — all /2160*100 = vmin. */
        --frame-h: 70.66vmin; /* 1526.33/2160*100 */
        --frame-w: calc(var(--frame-h) * 3 / 2);
        --frame-top: 5.23vmin; /* 113/2160*100 */
        --dots-gap: 5.23vmin; /* 113/2160*100 */
        --dots-w: 32.79vmin; /* 708.3/2160*100, width derived from dot-row height via its 2120:882 aspect */
        --tutorial-top: 10.83vmin; /* 234px @ 2160-tall landscape ref (234/2160*100) */
        --tutorial-gap: 4vmin;
        --tutorial-bottom: 8vmin;
        --tutorial-logo-w: 46.8vmin; /* 180% of 26vmin */
        --tutorial-video-w: 64.8vmin; /* 120% of 54vmin */
        /* Figma 정확한 수치 (@3839x2160 landscape ref): 좌우 여백 1107/1109px,
           상단 1878px, 하단 131px -> 전부 /2160*100 = vmin */
        --tutorial-text-w: 60.11vmin; /* 80% of 75.14vmin */

        /* QR result screen — rough first-pass eyeball, same as the tutorial
           overlay values above. */
        --qr-gap: 4vmin;
        --qr-text-gap: 1.5vmin;
        /* Exact Figma readout (@3839x2160 landscape ref): top 82px,
           left/right margins 1141/1140.5 -> thumb width = 3839-1141-1140.5
           = 1557.5, both /2160*100 = vmin. */
        --qr-top: 3.8vmin; /* 82/2160*100 */
        --qr-thumb-w: 72.11vmin; /* 1557.5/2160*100 */
        --qr-code-w: 21vmin;
        --qr-instruction-w: 24vmin;
        --qr-return-w: 40vmin;
        --tutorial-text-top: 86.94vmin; /* 1878/2160*100 */
        --tutorial-video-nudge-y: 0px;
        --tutorial-text-nudge-y: 0px;
      }
    }

    #camError {
      position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
      color: rgba(255,120,120,0.75); font-size: 11px; letter-spacing: 0.08em;
      pointer-events: none; z-index: 20; display: none;
      font-family: -apple-system, 'Malgun Gothic', sans-serif;
    }
    video { display: none; }

    /* ─── Framed camera/trail view ──────────────────────────────────────────
       Overrides the generic full-window `canvas{}` rule above (ID beats
       element-type selector) for just these two canvases. Corner radius is a
       fixed ratio (--frame-radius, 188/900 of the frame width) per the latest
       mockup — no longer a full pill; compositeCapture()'s canvas roundRect()
       uses the same ratio so the captured photo matches. */
    /* Anchored from the top (not vertically centered) per the latest mockup —
       leaves more black space below the frame than above it, for the guide
       hint that sits under it. */
    #feed, #fx {
      top: var(--frame-top); left: 50%; width: var(--frame-w); height: var(--frame-h);
      transform: translateX(-50%);
      border-radius: var(--frame-radius);
    }

    /* ─── Big-scene cross-fade (idle ↔ camera view ↔ QR result) ────────────
       Only these 3 top-level groups fade — everything inside a scene (which
       sub-state's elements are showing, the countdown digit, etc.) keeps its
       existing instant display:none/flex toggling untouched. Nothing in this
       touchless, gesture-driven app is actually clickable, so pointer-events
       stays off unconditionally rather than toggling it per scene. */
    .scene {
      position: fixed; inset: 0; opacity: 0; pointer-events: none;
      transition: opacity 500ms ease-in-out;
    }
    .scene.scene-visible { opacity: 1; }

    /* ─── Attract (idle/loop) screen ──────────────────────────────────────── */
    #attractBg { position: fixed; inset: 0; background: #000; z-index: 2; display: none; }
    #attract {
      position: fixed; top: 0; left: 0; right: 0; bottom: var(--attract-guide-total-h);
      z-index: 5; display: none;
      flex-direction: column; align-items: center; justify-content: center;
      pointer-events: none;
    }
    #attractLogo { width: var(--attract-logo-w); }
    #attractLogo svg { width: 100%; height: auto; display: block; } /* EVERY_ELSE_LOGO_SVG is natively white/gray — no invert needed */

    /* ─── Attract-screen hand-gesture guide — landing only, never shown once ──
       the person is actually in the live view (see updateScreens). ─────────── */
    #attractGuide {
      position: fixed; left: 50%; bottom: var(--attract-guide-bottom); transform: translateX(-50%);
      z-index: 5; display: none; flex-direction: column; align-items: center;
      gap: var(--attract-guide-gap);
      pointer-events: none;
    }
    #attractGuideText { width: var(--attract-guide-text-w); }
    #attractGuideText svg { width: 100%; height: auto; display: block; }
    #attractGuideAnim {
      width: var(--attract-anim-w); height: calc(var(--attract-anim-w) * 65 / 96); /* initial-gesture.webm is 3840x2600 */
      display: block; object-fit: cover; pointer-events: none;
    }

    /* ─── Wordmark baked into the bottom of the framed camera view ────────
       Replaces the old persistent top logo + light band — the design moved
       the branding into the photo frame itself (also drawn into the actual
       captured PNG, see compositeCapture) instead of a fixed top strip. */
    /* top-anchored (frame is top:6vmin now, not centered) — sits 4vmin above
       the frame's bottom edge (6vmin + --frame-h), minus the logo's own
       height (14vmin wide * LOGO_SVG's 63:288 aspect ratio ≈ 3.0625vmin) so
       its BOTTOM lands at that 4vmin inset rather than its top. */
    #frameLogo {
      position: fixed; left: 50%; top: calc(var(--frame-h) - 1.0625vmin);
      transform: translateX(-50%);
      width: 14vmin; z-index: 6; display: none; pointer-events: none;
    }
    #frameLogo svg { width: 100%; height: auto; display: block; filter: invert(1); }

    /* ─── Colored-dot "every else" graphic below the frame ─────────────────
       The frame's own "every else" wordmark is #frameLogo, baked INSIDE its
       bottom edge (not a separate element below it — an earlier pass added a
       duplicate text here by misreading the mockup; removed). Just this dot
       graphic sits below the frame now. */
    /* Portrait: exact Figma padding readout (@2160x3840 ref): 550/550
       left/right, 3078 top, 321 bottom, symbol itself 1060x441 -> all
       /2160*100 = vmin, decomposed into --frame-top + --frame-h + --dots-gap
       above. Landscape: rough first-pass eyeball, see media query below. */
    #frameBrandDots {
      position: fixed; left: 50%; transform: translateX(-50%);
      top: calc(var(--frame-top) + var(--frame-h) + var(--dots-gap));
      width: var(--dots-w); z-index: 6; display: none; pointer-events: none;
    }
    #frameBrandDots img { width: 100%; height: auto; display: block; } /* every-else-symbols.png is 2120x882 */

    /* ─── Onboarding tutorial overlay ───────────────────────────────────────
       Shown once, between the IDLE open->fist entry gesture and actually
       entering DRAWING — sits over the (already-live) camera/trail scene with
       a dark blurred glass layer, per the mockup. The same open->fist gesture
       that summoned it dismisses it; pointing/drawing is inert the whole time
       (see animate()'s TUTORIAL branch — it simply never calls
       addTrailSegment there). */
    #tutorial {
      position: fixed; inset: 0; z-index: 10; display: none;
      flex-direction: column; align-items: center;
      padding: var(--tutorial-top) 0 var(--tutorial-bottom);
      gap: var(--tutorial-gap);
      /* Extra bottom-weighted scrim (transparent top -> solid black bottom)
         layered on top of the flat 20% dim, so the instruction text at the
         bottom keeps contrast against the live camera feed without darkening
         the video up top as much — a background is always behind its
         element's own children, so this sits under the webm/text by
         construction, no z-index needed. */
      background:
        linear-gradient(to bottom, transparent 0%, transparent 15%, rgba(0,0,0,1) 75%, rgba(0,0,0,1) 100%),
        rgba(0,0,0,0.2);
      backdrop-filter: blur(20px);
      pointer-events: none;
    }
    #tutorialLogo { width: var(--tutorial-logo-w); }
    #tutorialLogo svg { width: 100%; height: auto; display: block; }
    #tutorialVideo {
      width: var(--tutorial-video-w); height: var(--tutorial-video-w); /* drawing-tutorial.webm is 3840x3840 */
      display: block; object-fit: cover;
      transform: translateY(var(--tutorial-video-nudge-y));
    }
    #tutorialText {
      position: fixed; top: calc(var(--tutorial-text-top) + var(--tutorial-text-nudge-y)); left: 50%;
      transform: translateX(-50%); width: var(--tutorial-text-w);
    }
    #tutorialText svg { width: 100%; height: auto; display: block; }
    /* Landscape uses a bottom-anchored position instead (131px @ 2160-tall
       ref = 6.06vmin) — more robust than a top offset since it doesn't
       depend on guessing the text's exact rendered height. */
    @media (orientation: landscape) {
      #tutorialText { top: auto; bottom: 6.06vmin; }
    }

    /* ─── Pre-capture countdown (5s, lets the visitor strike a pose) ──────── */
    /* No dark backdrop like #capturing below — the live feed + trail need to
       stay visible so people can actually see themselves posing under it. */
    #countdown {
      position: fixed; inset: 0; z-index: 15; display: none;
      align-items: center; justify-content: center;
      pointer-events: none;
    }
    #countdownNumber {
      height: 32vmin;
      filter: drop-shadow(0 4px 24px rgba(0,0,0,0.5));
    }
    #countdownNumber svg { height: 100%; width: auto; display: block; }

    /* ─── Capturing (brief transition after the countdown finishes) ───────── */
    #capturing {
      position: fixed; inset: 0; z-index: 15; display: none;
      background: rgba(0,0,0,0.55); backdrop-filter: blur(4px);
      align-items: center; justify-content: center;
      pointer-events: none;
    }
    #capturingText {
      color: #fff; font-size: 2vmin; letter-spacing: 0.05em;
      font-family: -apple-system, 'Malgun Gothic', sans-serif;
    }

    /* ─── QR display (post-capture, 40s auto-return to IDLE) ─────────────── */
    #qrScreen {
      position: fixed; inset: 0; z-index: 15; display: none;
      background: #000;
      flex-direction: column; align-items: center; justify-content: center;
      gap: var(--qr-gap);
      pointer-events: none;
    }
    /* Landscape: top-anchored instead of vertically centered, per the exact
       Figma readout (82px @ 2160-tall ref -> --qr-top below) — only the
       thumbnail's own position/size is precisely known from that mockup;
       the gaps below it still use --qr-gap's existing rough eyeball value. */
    @media (orientation: landscape) {
      #qrScreen { justify-content: flex-start; padding-top: var(--qr-top); }
    }
    /* The three text-only elements (instruction/countdown/return) get their
       own tighter gap, separate from #qrScreen's — otherwise a single shared
       flex `gap` can't have image-to-text spacing wider than text-to-text. */
    #qrTextGroup {
      display: flex; flex-direction: column; align-items: center;
      gap: var(--qr-text-gap);
    }
    /* The captured PNG is already clipped to its own pill silhouette (see
       compositeCapture) with transparent corners, so the wrapper no longer
       clips/rounds anything itself — a box-shadow here would draw a
       rectangular shadow poking out past the pill's rounded caps, so it's a
       drop-shadow on the img instead, which follows the actual alpha shape. */
    #qrThumb { width: var(--qr-thumb-w); }
    #qrThumb img {
      width: 100%; height: auto; display: block;
      filter: drop-shadow(0 8px 40px rgba(0,0,0,0.4));
    }
    #qrCodeBox {
      width: var(--qr-code-w); height: var(--qr-code-w); background: #fff; border-radius: 1.2vmin;
      display: flex; align-items: center; justify-content: center; padding: 1.4vmin;
    }
    /* !important beats the inline width/height (e.g. "style="width:300px;
       height:300px"") that qrcode.js writes onto the canvas itself — a plain
       rule here loses to that inline style regardless of selector specificity,
       which let the QR code render at a fixed 300px and overflow this box. */
    #qrCodeBox canvas { position: static; width: 100% !important; height: 100% !important; }
    /* Instruction copy exported to SVG path outlines (white main line + gray
       English sub-line baked into the same graphic), same approach as
       ATTRACT_GUIDE_TEXT_SVG — renders without a webfont.
       Width picked per SVG's own intrinsic aspect ratio (399:58 / 644:52) so
       height:auto lands both at roughly the same text size this replaces. */
    #qrInstructionText { width: var(--qr-instruction-w); }
    #qrInstructionText svg { width: 100%; height: auto; display: block; }
    #qrReturnText { width: var(--qr-return-w); }
    #qrReturnText svg { width: 100%; height: auto; display: block; }
    #qrCountdown {
      color: rgba(255,255,255,0.45); font-size: 1.5vmin; letter-spacing: 0.08em;
      font-family: -apple-system, 'Malgun Gothic', sans-serif;
    }
  </style>
</head>
<body>

<!-- Own canvas outside all 3 scenes below — see resize()/drawAttractRing —
     always full-window and only ever has content while IDLE, so it doesn't
     need its own fade; an empty canvas is invisible regardless of opacity. -->
<canvas id="ring" style="z-index:3"></canvas>

<div id="sceneIdle" class="scene">
  <div id="attractBg"></div>
  <div id="attract">
    <div id="attractLogo"></div>
  </div>
  <div id="attractGuide">
    <div id="attractGuideText"></div>
    <video id="attractGuideAnim" src="initial-gesture.webm" muted loop playsinline></video>
  </div>
</div>

<div id="sceneCamera" class="scene">
  <canvas id="feed" style="z-index:1"></canvas>
  <canvas id="fx" style="z-index:4"></canvas>
  <div id="frameLogo"></div>
  <div id="frameBrandDots"><img src="every-else-symbols.png" alt=""></div>

  <div id="tutorial">
    <div id="tutorialLogo"></div>
    <video id="tutorialVideo" src="drawing-tutorial.webm" muted loop playsinline></video>
    <div id="tutorialText"></div>
  </div>

  <div id="countdown">
    <div id="countdownNumber"></div>
  </div>

  <div id="capturing">
    <div id="capturingText">이미지 준비 중...</div>
  </div>
</div>

<div id="sceneQr" class="scene">
  <div id="qrScreen">
    <div id="qrThumb"><img id="qrThumbImg" alt=""></div>
    <div id="qrCodeBox"><canvas id="qrCanvas"></canvas></div>
    <div id="qrTextGroup">
      <div id="qrInstructionText"></div>
      <div id="qrCountdown"></div>
      <div id="qrReturnText"></div>
    </div>
  </div>
</div>

<div id="camError">카메라 접근 실패 — 권한을 허용하세요</div>

<video id="wv" playsinline muted></video>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/hands.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.4.4/build/qrcode.min.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" crossorigin="anonymous"></script>
<script>
'use strict';

// ─── Canvases ─────────────────────────────────────────────────────────────────
const feedCanvas = document.getElementById('feed');
const feedCtx    = feedCanvas.getContext('2d');
const fxCanvas   = document.getElementById('fx');
const fxCtx      = fxCanvas.getContext('2d');
// Idle dot-ring gets its own always-full-window canvas, separate from
// feed/fx (which are permanently framed to the 900:1350 photo shape below) —
// see resize() and drawAttractRing().
const ringCanvas = document.getElementById('ring');
const ringCtx    = ringCanvas.getContext('2d');
const camErrorEl = document.getElementById('camError');

// ─── Big-scene cross-fade wrappers — see setScene() ────────────────────────────
const sceneEls = {
  idle:   document.getElementById('sceneIdle'),
  camera: document.getElementById('sceneCamera'),
  qr:     document.getElementById('sceneQr'),
};
let activeScene = null;
function currentScene(state) {
  if (state === 'IDLE') return 'idle';
  if (state === 'QR_DISPLAY') return 'qr';
  return 'camera'; // TUTORIAL / DRAWING / COUNTDOWN / CAPTURING
}
function setScene(name) {
  if (name === activeScene) return;
  activeScene = name;
  for (const key in sceneEls) sceneEls[key].classList.toggle('scene-visible', key === name);
}

// ─── Exhibition screens ───────────────────────────────────────────────────────
const attractBgEl     = document.getElementById('attractBg');
const attractEl       = document.getElementById('attract');
const attractGuideEl     = document.getElementById('attractGuide');
const attractGuideAnimEl = document.getElementById('attractGuideAnim');
const frameLogoEl    = document.getElementById('frameLogo');
const frameBrandDotsEl = document.getElementById('frameBrandDots');
const tutorialEl      = document.getElementById('tutorial');
const tutorialLogoEl  = document.getElementById('tutorialLogo');
const tutorialVideoEl = document.getElementById('tutorialVideo');
const tutorialTextEl  = document.getElementById('tutorialText');
const countdownEl       = document.getElementById('countdown');
const countdownNumberEl = document.getElementById('countdownNumber');
const capturingEl    = document.getElementById('capturing');
const qrScreenEl     = document.getElementById('qrScreen');
const qrThumbImgEl   = document.getElementById('qrThumbImg');
const qrCanvasEl     = document.getElementById('qrCanvas');
const qrCountdownEl  = document.getElementById('qrCountdown');
const qrInstructionTextEl = document.getElementById('qrInstructionText');
const qrReturnTextEl      = document.getElementById('qrReturnText');

const tph2 = new Float32Array(TRAIL_MAX);

// instead of drawing in creation order is what makes stacking at overlaps
// random rather than "newest always on top."

// (jittered around that point) instead of one — individual particles are
// smaller than a single old-style dot, so the cluster's footprint (not any
// one particle) is what determines the stroke's visual thickness. Raise
// TRAIL_CLUSTER_MIN/MAX to make the stroke thicker still; TRAIL_MAX above
// was bumped to match so the drawing keeps roughly the same history length
// per unit of path even with more particles going down per point.
const TRAIL_CLUSTER_MIN = 5;
const TRAIL_CLUSTER_MAX = 9;

  const count = TRAIL_CLUSTER_MIN + ((Math.random() * (TRAIL_CLUSTER_MAX - TRAIL_CLUSTER_MIN + 1)) | 0);
  for (let n = 0; n < count; n++) {
    const i = trailWrite;
    const col = pickColor();
    const a = Math.random() * Math.PI * 2;
    const r = Math.random() * TRAIL_CLUSTER_JITTER * scale;
    tx[i] = x + Math.cos(a) * r;
    ty[i] = y + Math.sin(a) * r;
    tph[i]  = Math.random() * Math.PI * 2;
    tph2[i] = Math.random() * Math.PI * 2;
    tr[i] = col.r; tg[i] = col.g; tb[i] = col.b;
    tlayer[i] = Math.random();

    // now land near the same spot — this is what keeps the cluster's
    // combined footprint, not each individual dot, doing the old dot's job.
    trad[i] = (3 + Math.random() * 8) * scale * (1 + Math.random() * 1.2);
    trailWrite = (trailWrite + 1) % TRAIL_MAX;
    trailCount = Math.min(trailCount + 1, TRAIL_MAX);

// on one spot) with segment interpolation (fast movement between two tracked

  if (state !== 'TUTORIAL' && tutorialAnimPlaying) { tutorialVideoEl.pause(); tutorialVideoEl.currentTime = 0; tutorialAnimPlaying = false; }
  countdownEl.style.display = state === 'COUNTDOWN' ? 'flex' : 'none';
  capturingEl.style.display = state === 'CAPTURING' ? 'flex' : 'none';
  qrScreenEl.style.display  = state === 'QR_DISPLAY' ? 'flex' : 'none';
  if (state === 'QR_DISPLAY') {
    const remainMs = Math.max(0, QR_DISPLAY_MS - (performance.now() - qrStart));
    qrCountdownEl.textContent = Math.ceil(remainMs / 1000) + '초 후 초기화면으로 돌아갑니다';
  }
}

// Attract-loop ring: uses RING_PALETTE (its own muted 12-color set — see
// above), not the particle palette, laid out in a slowly rotating circle.
// Per-dot placement/size jitter is rolled once so the ring reads as organic
// rather than a perfectly even polygon; only the ring's overall radius
// "breathes" in and out — the dots themselves never change size, per the brief.
const ringJitterR = RING_PALETTE.map(() => 0.85 + Math.random() * 0.3);
const ringJitterA = RING_PALETTE.map(() => (Math.random() - 0.5) * 0.15);
const ringDotScale = RING_PALETTE.map(() => 0.7 + Math.random() * 0.6);
const RING_ROTATE_S  = 25; // seconds per full rotation — slow, ambient
const RING_BREATHE_S = 7;  // seconds per breathe cycle

function drawAttractRing(W, H) {
  // Center/size the ring within the space ABOVE the guide-text + hand-gesture
  // band (see attractGuideReservedH), not the full viewport — otherwise the
  // ring's dots can extend down into that band and overlap it.
  const availH = Math.max(H - attractGuideReservedH, H * 0.4);
  const cx = W / 2, cy = availH / 2;
  const baseR = Math.min(W, availH) * ringRadiusRatio;
  const breathe = 1 + Math.sin((t / RING_BREATHE_S) * PI2) * 0.12;
  const rot = (t / RING_ROTATE_S) * PI2;
  const dotR = Math.min(W, availH) * 0.014;
  for (let i = 0; i < RING_PALETTE.length; i++) {
    const a = rot + (i / RING_PALETTE.length) * PI2 + ringJitterA[i];
    const R = baseR * breathe * ringJitterR[i];
    const x = cx + Math.cos(a) * R;
    const y = cy + Math.sin(a) * R;
    const [r, g, b] = RING_PALETTE[i];
    ringCtx.beginPath();
    ringCtx.arc(x, y, dotR * ringDotScale[i], 0, PI2);
    ringCtx.fillStyle = `rgb(${r},${g},${b})`;
    ringCtx.fill();
  }
}

// ─── Capture: composite → JPEG → upload → QR ─────────────────────────────────
// TODO: fill these in once the Supabase project exists — Project Settings →
// API for the URL/anon key, Storage → New bucket for the bucket name (public,
// with an anon-INSERT policy). Until then, capture still works end-to-end;
// it just shows a placeholder QR instead of a real upload link, so the rest
// of the flow (drawing, gesture, countdown) is demoable without an account.
const SUPABASE_URL = 'https://ixekshjsugptjdiqcfdj.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml4ZWtzaGpzdWdwdGpkaXFjZmRqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ3ODkxMzcsImV4cCI6MjEwMDM2NTEzN30.NMvbHayuwrZu2w9Ne41FWznsaotWsnaCEqKcakq4UIM';
const SUPABASE_BUCKET = 'MEP_interactive_photos';
const supabaseClient = (SUPABASE_URL && SUPABASE_ANON_KEY)
  ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
  : null;

// Baked into the bottom of the exported photo (see compositeCapture) so the
// wordmark travels with the image itself, not just the on-screen #frameLogo
// overlay. Loaded once; startCapture() awaits decode() before the first use.
const captureLogoImg = new Image();
captureLogoImg.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(LOGO_SVG);

function compositeCapture() {
  const W = fxCanvas.width, H = fxCanvas.height;
  const out = document.createElement('canvas');
  out.width = W; out.height = H;
  const octx = out.getContext('2d');
  // Same fixed corner radius as the on-screen frame (--frame-radius, 188/900
  // of the frame width) — not a full pill anymore, see #feed/#fx in the CSS.
  // Clipping (not filling) leaves everything outside transparent for PNG
  // export, and applies to both layers drawn below.
  octx.beginPath();
  octx.roundRect(0, 0, W, H, W * 188 / 900);
  octx.clip();
  // Live camera behind, desaturated — the "photo" layer is black & white...
  octx.filter = 'grayscale(1)';
  octx.drawImage(feedCanvas, 0, 0);
  octx.filter = 'none';
  // ...while the trail (+ vignette) stays full color on top, so only the
  // particles read as color against the grayscale photo.
  octx.drawImage(fxCanvas, 0, 0);
  // Wordmark, white (invert(1), same trick the on-screen #frameLogo CSS uses
  // on the raw black-fill LOGO_SVG), sized/positioned to match #frameLogo's
  // 14vmin-within-a-60vmin-frame proportions and 4vmin-within-90vmin inset.
  octx.filter = 'invert(1)';
  const logoW = W * 14 / 60;
  const logoH = logoW * 63 / 288; // LOGO_SVG's own viewBox aspect ratio
  const logoBottomInset = H * 4 / 90;
  octx.drawImage(captureLogoImg, (W - logoW) / 2, H - logoBottomInset - logoH, logoW, logoH);
  octx.filter = 'none';
  return out;
}

let lastThumbURL = null;
async function startCapture() {
  await captureLogoImg.decode().catch(() => {});
  const canvas = compositeCapture();
  const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
  if (lastThumbURL) URL.revokeObjectURL(lastThumbURL); // avoid leaking blob URLs over many visitors
  lastThumbURL = URL.createObjectURL(blob);
  qrThumbImgEl.src = lastThumbURL;

  let url = null;
  // Surfaced instead of silently swallowed: this used to fall through to the
  // same "not configured" placeholder whether Supabase was never set up OR a
  // real upload attempt failed, which made a genuine failure undiagnosable
  // (no console signal, no hint in the QR itself) — logged here and, if
  // there's an error, shown briefly in the fallback QR text below too, since
  // a kiosk screen isn't somewhere you can pop devtools open on to check.
  let uploadFailureReason = null;
  if (supabaseClient) {
    try {
      const path = `capture-${Date.now()}-${Math.random().toString(36).slice(2, 8)}.png`;
      const { error } = await supabaseClient.storage.from(SUPABASE_BUCKET)
        .upload(path, blob, { contentType: 'image/png', upsert: false });
      if (!error) {
        url = supabaseClient.storage.from(SUPABASE_BUCKET).getPublicUrl(path).data.publicUrl;
      } else {
        console.error('Supabase upload returned an error:', error);
        uploadFailureReason = error.message || String(error);
      }
    } catch (e) {
      console.error('Supabase upload threw:', e);
      uploadFailureReason = e.message || String(e);
    }
  }

  if (window.QRCode) {
    // Rendered well above #qrCodeBox's own CSS size (26vmin — up to ~560px on
    // a 4K portrait display) so the box's CSS scales the canvas DOWN rather
    // than the browser stretching a small bitmap UP into blur that could
    // start costing scanners modules at the QR's edges.
    const fallbackText = uploadFailureReason
      ? `업로드 실패: ${uploadFailureReason}`
      : 'Supabase가 아직 설정되지 않았습니다';
    QRCode.toCanvas(qrCanvasEl, url || fallbackText, { width: 800, margin: 1 }, () => {});
  }

  qrStart = performance.now();
  state = 'QR_DISPLAY';
  // The fist that just triggered this capture is very likely still held as
  // this async function resolves — without invalidating "seen open recently"
  // here (same idea as the pointing-confirmed reset above), that stale fist
  // would immediately satisfy the QR_DISPLAY return-to-IDLE gesture below and
  // bounce straight back out before the visitor even sees their QR code.
  openSeenAt = -Infinity;
}

// ─── Render loop ──────────────────────────────────────────────────────────────
let t = 0;
const PI2 = Math.PI * 2;
// Small idle life: a tight float + a gentle size breathe — same values as the
// previous silhouette-fill mode, just applied to a trail particle's fixed
// draw position (tx/ty) instead of a fixed anchor's projected position.
const FLOAT_R      = 5 * (Math.min(window.innerWidth, window.innerHeight) / 1080); // 5px wander radius
const PULSE_AMOUNT = 0.18; // size breathes ±18% around its base radius
const FRAME_MS = 1000 / 60; // 60fps cap
let lastFrameTime = 0;
let wasPointingActive = false;
// Reused every frame for the trail's draw-order sort (see below) instead of
// allocating a fresh array each time.
const trailOrder = new Uint16Array(TRAIL_MAX);

function animate(now) {
  requestAnimationFrame(animate);
  if (now - lastFrameTime < FRAME_MS) return;
  lastFrameTime = now;
  t += 1 / 30;
  const W = fxCanvas.width, H = fxCanvas.height;
  const scale = Math.min(W, H) / 1080;
  fxCtx.clearRect(0, 0, W, H);

  // ── Debounced hand-shape signals ────────────────────────────────────────────
  // Same leaky-integrator + hysteresis idea for all three raw reads, not just
  // pointing — see the declarations above for why.
  pointingConfidence += ((rawPointing ? 1 : 0) - pointingConfidence) * SHAPE_SMOOTH;
  pointingActive = pointingActive ? pointingConfidence >= SHAPE_OFF : pointingConfidence >= SHAPE_ON;
  openConfidence += ((rawOpenHand ? 1 : 0) - openConfidence) * SHAPE_SMOOTH;
  openActive = openActive ? openConfidence >= SHAPE_OFF : openConfidence >= SHAPE_ON;
  const wasFistActive = fistActive;
  fistConfidence += ((rawFist ? 1 : 0) - fistConfidence) * SHAPE_SMOOTH;
  fistActive = fistActive ? fistConfidence >= SHAPE_OFF : fistConfidence >= SHAPE_ON;
  if (fistActive && !wasFistActive) fistActiveSince = now;

  if (pointingActive && !wasPointingActive) { lastTrailX = null; lastTrailY = null; } // don't connect across a gap
  wasPointingActive = pointingActive;
  if (openActive) openSeenAt = now;
  // The moment pointing is confirmed, whatever "open recently" arming existed
  // is stale intent (they've moved on to drawing) — clearing it here is what
  // stops a swipe-then-point transition from still counting as open->fist a
  // frame or two later.
  if (pointingActive) openSeenAt = -Infinity;

  // Clear gesture: open hand, tracked position swept far sideways within
  // SWIPE_WINDOW_MS. Re-anchors its start point whenever the window lapses
  // without enough movement, so it keeps checking "the last little while"
  // rather than only ever measuring from the moment the hand first opened.
  if (openActive && fingerX !== null) {
    if (swipeStartX === null) {
      swipeStartX = fingerX; swipeStartTime = now;
    } else if (now - swipeStartTime < SWIPE_WINDOW_MS) {
      if (Math.abs(fingerX - swipeStartX) > W * SWIPE_DIST_RATIO) {
        if (state === 'DRAWING') resetTrail();
        swipeStartX = null;
      }
    } else {
      swipeStartX = fingerX; swipeStartTime = now;
    }
  } else {
    swipeStartX = null;
  }

  // ── State machine ──────────────────────────────────────────────────────────
  if (state === 'IDLE') {
    // The only entry trigger — open hand -> fist, same gesture (and
    // debounce) as the capture trigger below — matches initial-gesture.webm's
    // "spread your hand, then make a fist" onboarding. Pointing alone no
    // longer arms anything; it only matters once already in DRAWING, below.
    if (fistActive && (now - openSeenAt) < OPEN_TO_FIST_WINDOW_MS && (now - fistActiveSince) >= FIST_HOLD_MS) {
      state = 'TUTORIAL';
      // Same reset every other transition in this state machine uses on the
      // way in — without it, the fist that just entered TUTORIAL would still
      // satisfy "recently open" and immediately dismiss it again next frame.
      openSeenAt = -Infinity;
    }
  } else if (state === 'TUTORIAL') {
    // Same open->fist gesture (per the instruction SVG shown on this overlay)
    // dismisses the tutorial and hands off straight into DRAWING. Pointing is
    // deliberately not read here at all — no addTrailSegment call in this
    // branch — so the finger-draw interaction stays fully inert until this
    // gesture fires.
    if (fistActive && (now - openSeenAt) < OPEN_TO_FIST_WINDOW_MS && (now - fistActiveSince) >= FIST_HOLD_MS) {
      state = 'DRAWING'; lastPointingSeenAt = now;
      // Same reset again on the way out, so the fist that just started
      // DRAWING doesn't also immediately satisfy the capture trigger below.
      openSeenAt = -Infinity;
    }
  } else if (state === 'DRAWING') {
    if (pointingActive) lastPointingSeenAt = now;
    if (now - lastPointingSeenAt > DRAWING_TIMEOUT_MS) {
      // Abandoned mid-drawing — clear it for the next visitor rather than
      // leaving a stale drawing waiting for a capture that isn't coming.
      resetTrail();
      state = 'IDLE';
    } else if (fistActive && (now - openSeenAt) < OPEN_TO_FIST_WINDOW_MS && (now - fistActiveSince) >= FIST_HOLD_MS) {
      // Not an immediate capture — give them COUNTDOWN_MS to strike whatever
      // pose they actually want before startCapture() fires (see below).
      state = 'COUNTDOWN';
      countdownStart = now;
      countdownDigit = 5;
      countdownNumberEl.innerHTML = COUNTDOWN_DIGIT_SVG[5];
    } else if (pointingActive && fingerX !== null && fingerY !== null) {
      addTrailSegment(fingerX, fingerY, scale);
    }
  } else if (state === 'COUNTDOWN') {
    const digit = Math.max(1, 5 - Math.floor((now - countdownStart) / 1000));
    if (digit !== countdownDigit) {
      countdownDigit = digit;
      countdownNumberEl.innerHTML = COUNTDOWN_DIGIT_SVG[digit];
    }
    if (now - countdownStart >= COUNTDOWN_MS) {
      state = 'CAPTURING';
      captureStarted = false; // fire startCapture() once, after this frame finishes painting — see below
    }
  } else if (state === 'QR_DISPLAY') {
    // Same open->fist gesture as the DRAWING capture trigger (see #qrGestureText
    // on the QR screen) lets a visitor skip the rest of the countdown and
    // return to IDLE immediately instead of waiting out QR_DISPLAY_MS.
    if (fistActive && (now - openSeenAt) < OPEN_TO_FIST_WINDOW_MS && (now - fistActiveSince) >= FIST_HOLD_MS) {
      resetTrail();
      state = 'IDLE';
      // Same reset startCapture() does on the way INTO QR_DISPLAY, needed
      // here on the way OUT — without it, the very fist that just returned
      // us to IDLE still reads as "recently open" and immediately satisfies
      // IDLE's own open->fist entry trigger (added since), bouncing straight
      // back into DRAWING before the visitor's hand has even moved.
      openSeenAt = -Infinity;
    } else if (now - qrStart >= QR_DISPLAY_MS) {
      resetTrail();
      state = 'IDLE';
    }
  }
  // CAPTURING has no per-frame transition of its own — startCapture() moves
  // it to QR_DISPLAY asynchronously once the composite/upload/QR are ready.

  updateScreens(state);

  // ── Attract loop (idle) ─────────────────────────────────────────────────────
  // Own canvas, own W/H (full window, not fx's now-framed size) — cleared
  // unconditionally each frame, same as fxCtx above, so nothing stale lingers
  // once the ring canvas fades out with #sceneIdle.
  ringCtx.clearRect(0, 0, ringCanvas.width, ringCanvas.height);
  if (state === 'IDLE') drawAttractRing(ringCanvas.width, ringCanvas.height);

  // ── Trail particles ────────────────────────────────────────────────────────
  // COUNTDOWN included so the trail already drawn stays visible (and gets
  // captured) while a visitor poses through the countdown.
  if ((state === 'DRAWING' || state === 'COUNTDOWN' || state === 'CAPTURING') && trailCount > 0) {
    blobCtx.clearRect(0, 0, W, H);
    // Draw in an order sorted by each particle's fixed random tlayer, not by
    // index/creation order — otherwise whichever particle was drawn most
    // recently always paints over older ones at every overlap, so newer
    // strokes always look "in front." Since tlayer never changes once set,
    // this sort is stable frame to frame (no flicker), just not tied to
    // recency.
    for (let i = 0; i < trailCount; i++) trailOrder[i] = i;
    const order = trailOrder.subarray(0, trailCount);
    order.sort((a, b) => tlayer[a] - tlayer[b]);
    for (let k = 0; k < trailCount; k++) {
      const i = order[k];
      const cx = tx[i] + Math.cos(t * 0.5 + tph[i])  * FLOAT_R;
      const cy = ty[i] + Math.sin(t * 0.5 + tph2[i]) * FLOAT_R;
      const r  = trad[i] * (1 + Math.sin(t * 0.35 + tph[i]) * PULSE_AMOUNT);
      blobCtx.beginPath();
      blobCtx.arc(cx, cy, r, 0, PI2);
      blobCtx.fillStyle = `rgb(${tr[i]|0},${tg[i]|0},${tb[i]|0})`;
      blobCtx.fill();
    }
    fxCtx.drawImage(blob, 0, 0); // no domain clipping — the whole screen is fair game now
  }

  // ── Vignette ───────────────────────────────────────────────────────────────
  // Only while fx is actually showing camera/trail content — it used to run
  // unconditionally, which was harmless when fx filled the whole screen at
  // every state, but now that fx is permanently framed to the 900:1350 photo
  // shape, drawing this during IDLE/QR_DISPLAY would paint a stray
  // semi-transparent pill in the middle of screens that don't use fx at all.
  if (state === 'DRAWING' || state === 'COUNTDOWN' || state === 'CAPTURING' || state === 'TUTORIAL') {
    const vg = fxCtx.createRadialGradient(W/2, H/2, H*0.3, W/2, H/2, H*0.9);
    vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.38)');
    fxCtx.fillStyle = vg; fxCtx.fillRect(0, 0, W, H);
  }

  // Only now — after the trail + vignette are actually painted onto fxCanvas
  // for *this* frame — is it safe to snapshot it. Triggering this any earlier
  // in the function (e.g. right where the fist gesture is detected, above)
  // would composite a still-blank fxCanvas, since it's cleared at the top of
  // every animate() call and only repainted further down.
  if (state === 'CAPTURING' && !captureStarted) {
    captureStarted = true;
    startCapture();
  }
}

requestAnimationFrame(animate);
</script>
