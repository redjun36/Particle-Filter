<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Depth Particle — MEP Interactive</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; font-family: 'Courier New', monospace; }
    canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; }

    #glass {
      position: fixed; display: none; pointer-events: none;
      border-radius: 5.4vmin;
      border: 1px solid rgba(255,255,255,0.38);
      background: #fff;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.22), 0 8px 40px rgba(0,0,0,0.12);
      z-index: 3;
      transition: box-shadow .5s ease, border-color .5s ease;
    }
    /* Replaces the old spinner-style "arming ring" — a slow, soft breathing
       glow on the frame itself reads as "recognizing you" without looking
       like a loading indicator. */
    #glass.arming {
      border-color: rgba(200,230,255,0.55);
      animation: armGlow 1.1s ease-in-out infinite;
    }
    @keyframes armGlow {
      0%, 100% { box-shadow: inset 0 0 0 1px rgba(255,255,255,0.22), 0 0 18px rgba(160,210,255,0.15); }
      50%      { box-shadow: inset 0 0 0 1px rgba(200,230,255,0.5),  0 0 34px rgba(160,210,255,0.4); }
    }
    #camError {
      position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
      color: rgba(255,120,120,0.75); font-size: 11px; letter-spacing: 0.08em;
      pointer-events: none; z-index: 20; display: none;
      font-family: -apple-system, 'Malgun Gothic', sans-serif;
    }
    video { display: none; }

    /* ─── Attract (idle/loop) screen ──────────────────────────────────────── */
    #attractBg { position: fixed; inset: 0; background: #000; z-index: 2; display: none; }
    #attract {
      position: fixed; inset: 0; z-index: 5; display: none;
      flex-direction: column; align-items: center; justify-content: center;
      pointer-events: none;
    }
    #attractLogo { width: 22vmin; margin-bottom: 2.2vmin; }
    #attractLogo svg { width: 100%; height: auto; display: block; filter: invert(1); }
    #attractTag {
      color: rgba(255,255,255,0.55); font-size: 1.7vmin; letter-spacing: 0.04em;
      font-family: -apple-system, 'Malgun Gothic', sans-serif;
    }

    /* ─── Attract-screen hand-gesture guide — landing only, never shown once ──
       the person is actually in the live view (see updateScreens). ─────────── */
    #attractLottie {
      position: fixed; left: 50%; bottom: 4vmin; transform: translateX(-50%);
      width: 46vmin; height: calc(46vmin * 843 / 2143);
      z-index: 5; display: none; pointer-events: none;
    }

    /* ─── Persistent top logo + light band (arming/active) ───────────────── */
    #topBand {
      position: fixed; top: 0; left: 0; right: 0; height: 15vmin; z-index: 7;
      background: linear-gradient(to bottom, rgba(255,255,255,0.94), rgba(255,255,255,0));
      pointer-events: none; display: none;
    }
    #topLogo {
      position: fixed; top: 3.6vmin; left: 50%; transform: translateX(-50%);
      width: 13vmin; z-index: 9; display: none; pointer-events: none;
    }
    #topLogo svg { width: 100%; height: auto; display: block; }

    /* ─── Live-view gesture reminder (arming) ─────────────────────────────── */
    #guide {
      position: fixed; left: 50%; bottom: 9vmin; transform: translateX(-50%);
      z-index: 8; display: none; flex-direction: column; align-items: center; gap: 1.6vmin;
      padding: 2.4vmin 3.6vmin; border-radius: 2.2vmin;
      background: rgba(0,0,0,0.38); backdrop-filter: blur(8px);
      pointer-events: none;
    }
    #guideText {
      color: #fff; font-size: 1.6vmin; line-height: 1.55; text-align: center;
      font-family: -apple-system, 'Malgun Gothic', sans-serif;
    }
    #guideIcon { width: 9vmin; color: #fff; }
    #guideIcon svg { width: 100%; height: auto; display: block; }
  </style>
</head>
<body>

<div id="glass"></div>
<canvas id="fx" style="z-index:4"></canvas>
<div id="topBand"></div>

<div id="attract">
  <div id="attractLogo"></div>
  <div id="attractTag">Open your eyes and gaze.</div>
</div>

<div id="attractLottie"></div>

<div id="topLogo"></div>

<div id="guide">

  <div id="guideIcon"></div>
</div>

// corners (thumb+index) rather than an attempt at literal hand anatomy.
const HAND_ICON_SVG = `<svg viewBox="0 0 120 90" fill="none" xmlns="http://www.w3.org/2000/svg" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
<path d="M15 20 L55 20 M15 20 L15 50 M15 20 L28 32"/>
<path d="M105 70 L65 70 M105 70 L105 40 M105 70 L92 58"/>
</svg>`;

attractEl.querySelector('#attractLogo').innerHTML = LOGO_SVG;
topLogoEl.innerHTML                               = LOGO_SVG;
guideEl.querySelector('#guideIcon').innerHTML     = HAND_ICON_SVG;

// Landing-screen hand-gesture guide — a Lottie animation (JSON embedded in
// #lottieHandGestureData, loaded from the source file) instead of a static
// image. Only ever shown/played while IDLE; see updateScreens.
const lottieData = JSON.parse(document.getElementById('lottieHandGestureData').textContent);
// This export has static ("a":0) shape-path properties whose "k" is wrapped
// in a one-element array (missing the "t"/"s" keyframe wrapper), instead of
// the plain {i,o,v,c} object a non-animated shape path should have. lottie-web
// can't parse that hybrid shape and silently renders an empty <path> for
// every layer that hits it — unwrap it before handing the data to lottie.
(function fixStaticShapePaths(shapes) {
  for (const s of shapes) {
    if (s.ty === 'sh' && s.ks && s.ks.a === 0 && Array.isArray(s.ks.k)) s.ks.k = s.ks.k[0];
    if (s.it) fixStaticShapePaths(s.it);
  }
})([].concat(...lottieData.layers.map(l => l.shapes || [])));

const attractLottieAnim = lottie.loadAnimation({
  container: attractLottieEl,
  renderer: 'svg',
  loop: true,
  autoplay: false,
  animationData: lottieData
});
// lottie-web's SVG renderer builds its DOM lazily — with autoplay off it never
// renders even frame 0 until something explicitly ticks it, which left the
// container empty (no <path> elements at all) until our own rAF loop got
// around to calling play() for the first time. Force that first build now.
attractLottieAnim.goToAndStop(0, true);
attractLottieAnim.play();

const blob    = document.createElement('canvas');
const blobCtx = blob.getContext('2d');

function resize() {
  const W = window.innerWidth, H = window.innerHeight;
  [feedCanvas, fxCanvas, blob].forEach(c => { c.width = W; c.height = H; });
}
window.addEventListener('resize', resize);
resize();

// ─── Palette — from the reference brand color sheet ──────────────────────────
const PALETTE = [
  [253, 209, 231], // pale pink
  [250, 140, 238], // every Love (magenta pink)
  [201, 131, 247], // purple
  [124, 161, 251], // blue
  [ 0, 190, 252], // every Calm (cyan)
  [ 95, 250, 234], // turquoise
  [251, 130, 104], // coral
  [253, 181, 108], // orange
  [250, 251, 156], // every Warmth (pale yellow)
  [193, 250, 108], // lime
  [ 0, 218, 130], // every Bloom (green)
  [166, 244, 214], // mint
];

function pickColor() {
  const [r, g, b] = PALETTE[(Math.random() * PALETTE.length) | 0];
  const jitter = () => (Math.random() - 0.5) * 16;
  return {
    r: Math.min(255, Math.max(0, r + jitter())),
    g: Math.min(255, Math.max(0, g + jitter())),
    b: Math.min(255, Math.max(0, b + jitter())),
  };
}

// ─── Particle pool — fixed slots ──────────────────────────────────────────────
// Each particle index owns a permanent anchor point (in `sc` mask-space),
// assigned once below and never reassigned. A rebuild only turns a slot's
// alpha on/off depending on whether its anchor currently falls inside the
// silhouette+domain — it never moves the anchor. That's what makes "no more
// flicker" possible: there's nothing to interpolate between, because a given
// particle never has a new target to jump to in the first place.
const N_MAX = 3000; // denser fill — less gap, still shows real background through
let   N_cur = 0; // currently active particle count

// Fixed anchor, in `sc` (mask) space — set once in the init loop below
const psx  = new Float32Array(N_MAX);
const psy  = new Float32Array(N_MAX);
// Per-anchor fixed "luck" threshold for the density check in buildTargets —
// rolled once at init, not re-rolled every rebuild. Re-rolling it every 200ms
// was the real bug behind "particles keep jumping to random spots": a static
// silhouette would still make ~1/3 of the anchors flip on/off each cycle for
// no reason, which reads as flicker/relocation even though no anchor ever
// actually moved. A fixed threshold makes an anchor's on/off state track the
// silhouette only, not a fresh coin flip.
const pluck = new Float32Array(N_MAX);
// Base positions — the anchor projected into screen space (recomputed each
// build so a window resize keeps particles correctly placed)
const pbx  = new Float32Array(N_MAX);
const pby  = new Float32Array(N_MAX);
// Per-particle phase for the small idle float + size pulse (see render loop)
const pph  = new Float32Array(N_MAX);
const pph2 = new Float32Array(N_MAX);
// Visual properties
const pr   = new Float32Array(N_MAX);
const pg   = new Float32Array(N_MAX);
const pb   = new Float32Array(N_MAX);
const prad = new Float32Array(N_MAX); // base/target radius, rolled when a slot activates
// On/off state — 1 = visible, 0 = not. No fade in between; see buildTargets.
const pta  = new Float32Array(N_MAX);

for (let i = 0; i < N_MAX; i++) {
  pluck[i] = Math.random() * 100;
  pph[i]   = Math.random() * Math.PI * 2;
  pph2[i]  = Math.random() * Math.PI * 2;
}

// Lay the anchors out on a jittered grid spanning the whole mask canvas, then
// shuffle which array index owns which anchor. That one-time shuffle is what
// keeps draw order (index order) from following scan order — which is what
// caused the shingled/fish-scale look (every particle below always painting
// over the one above it wherever they overlapped).
{
  const SW = 640, SH = 480; // matches the `sc` canvas below
  const cols = Math.max(1, Math.round(Math.sqrt(N_MAX * SW / SH)));
  const rows = Math.max(1, Math.ceil(N_MAX / cols));
  const cellW = SW / cols, cellH = SH / rows;
  const anchors = [];
  for (let ry = 0; ry < rows; ry++) {
    for (let rx = 0; rx < cols; rx++) {
      if (anchors.length >= N_MAX) break;
      anchors.push({
        x: (rx + 0.15 + Math.random() * 0.7) * cellW,
        y: (ry + 0.15 + Math.random() * 0.7) * cellH,
      });
    }
  }
  for (let i = anchors.length - 1; i > 0; i--) {
    const j = (Math.random() * (i + 1)) | 0;
    const tmp = anchors[i]; anchors[i] = anchors[j]; anchors[j] = tmp;
  }
  for (let i = 0; i < anchors.length; i++) { psx[i] = anchors[i].x; psy[i] = anchors[i].y; }
  N_cur = anchors.length;
}

// ─── Depth layer config ───────────────────────────────────────────────────────
const layerCfg = [
  { radBase: 3,  radRange: 2,  alphaMax: 0.50 }, // far
  { radBase: 5,  radRange: 3,  alphaMax: 0.65 },
  { radBase: 7,  radRange: 3,  alphaMax: 0.80 },
  { radBase: 10, radRange: 4,  alphaMax: 1.00 }, // near
];

// ─── State ────────────────────────────────────────────────────────────────────
// IDLE (attract loop) -> ARMING (live view + hint) -> ACTIVE (the particle effect)
let state      = 'IDLE';
let frameRect  = null;
let clipRect   = null;
let armStart   = 0;
let lastBuild  = 0;
let segReady   = false;
const ARM_MS = 600, REBUILD_MS = 200;

// ─── Build targets — tests each fixed anchor against the current silhouette ──
function buildTargets(rect) {
  if (!segReady) return;
  const SW = sc.width, SH = sc.height;
  const W  = fxCanvas.width, H = fxCanvas.height;
  let imgData;
  try { imgData = scCtx.getImageData(0, 0, SW, SH); }
  catch(e) { return; }
  const d = imgData.data;
  const scale = Math.min(W, H) / 1080;

  for (let i = 0; i < N_cur; i++) {
    const sx = psx[i] | 0, sy = psy[i] | 0;
    const idx = (sy * SW + sx) * 4;

    const scrX = (1 - sx / SW) * W;
    const scrY = (sy / SH) * H;
    pbx[i] = scrX;
    pby[i] = scrY;

    if (d[idx + 3] < 40 || scrX < rect.x1 || scrX > rect.x2 || scrY < rect.y1 || scrY > rect.y2) {
      pta[i] = 0; // instant off, no fade-out ramp
      continue;
    }

    const lum     = 0.299*d[idx] + 0.587*d[idx+1] + 0.114*d[idx+2];
    const density = 32 + (lum / 255) * 68; // 32(dark) ~ 100(bright)
    // Bright anchors more likely than dark, but dark regions (hair/dark
    // clothing) still get enough coverage to stay legible. Uses this anchor's
    // fixed pluck value, not a fresh roll, so the on/off state only changes
    // when the silhouette under it actually changes.
    if (pluck[i] > density) { pta[i] = 0; continue; }

    if (pta[i] !== 1) {
      // Only re-roll color/size when the slot is newly activating — keeps a
      // continuously-visible particle's look stable instead of relabeling it
      // every 200ms.
      const col = pickColor();
      pr[i] = col.r; pg[i] = col.g; pb[i] = col.b;
      // Same base size as before, scaled up by a random 1x~2.5x factor so
      // particle size varies noticeably.
      prad[i] = (6 + Math.random() * 14) * scale * (1 + Math.random() * 1.5);
    }
    pta[i] = 1; // fully opaque so overlapping particles fully occlude, not blend, and instant — no fade-in ramp
  }
}

// ─── Segmentation ─────────────────────────────────────────────────────────────
const selfie = new SelfieSegmentation({
  locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/${f}`
});
selfie.setOptions({ modelSelection: 1 });
selfie.onResults(res => {
  const W = feedCanvas.width, H = feedCanvas.height;
  feedCtx.save();
  feedCtx.translate(W, 0); feedCtx.scale(-1, 1);
  feedCtx.drawImage(res.image, 0, 0, W, H);
  feedCtx.restore();

  const SW = sc.width, SH = sc.height;
  scCtx.clearRect(0, 0, SW, SH);
  scCtx.drawImage(res.image, 0, 0, SW, SH);
  scCtx.globalCompositeOperation = 'destination-in';
  scCtx.drawImage(res.segmentationMask, 0, 0, SW, SH);
  scCtx.globalCompositeOperation = 'source-over';
  segReady = true;
});

// ─── Hands ────────────────────────────────────────────────────────────────────
function indexUp(lm) { return lm[8].y < lm[6].y - 0.01; }

const hands = new Hands({ locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/${f}` });
hands.setOptions({ maxNumHands:2, modelComplexity:1, minDetectionConfidence:0.6, minTrackingConfidence:0.5 });
hands.onResults(res => {
  const mhl = res.multiHandLandmarks;
  const W = fxCanvas.width, H = fxCanvas.height;
  if (!mhl || mhl.length < 2 || !mhl.every(lm => indexUp(lm))) { frameRect = null; return; }

  const xVals = mhl.map(lm => (1 - lm[8].x) * W);
  const yVals = []; mhl.forEach(lm => { yVals.push(lm[8].y*H, lm[4].y*H); });

  const x1 = Math.min(...xVals), x2 = Math.max(...xVals);
  const y1 = Math.min(...yVals), y2 = Math.max(...yVals);
  if (x2-x1 < 50 || y2-y1 < 40) { frameRect = null; return; }
  frameRect = { x1: x1-14, y1: y1-14, x2: x2+14, y2: y2+14 };
});

// ─── Camera ───────────────────────────────────────────────────────────────────
const wv = document.getElementById('wv');
let tick = 0;
const cam = new Camera(wv, {
  onFrame: async () => {
    tick++;
    await hands.send({ image: wv });
    if (tick % 2 === 0) await selfie.send({ image: wv });
  },
  width: 1280, height: 720
});
cam.start().catch(() => { camErrorEl.style.display = 'block'; });

// ─── Glass div ────────────────────────────────────────────────────────────────
function updateGlass(rect, on, arming) {
  if (!on || !rect) { glassEl.style.display = 'none'; glassEl.classList.remove('arming'); return; }
  glassEl.style.display = 'block';
  glassEl.style.left   = rect.x1 + 'px';
  glassEl.style.top    = rect.y1 + 'px';
  glassEl.style.width  = (rect.x2 - rect.x1) + 'px';
  glassEl.style.height = (rect.y2 - rect.y1) + 'px';
  glassEl.classList.toggle('arming', !!arming);
}

// ─── Exhibition screens ────────────────────────────────────────────────────────
// feed canvas is only meaningful once the person is actually being guided into
// or is inside the experience — attract is a stylized, camera-free screen.
let attractLottiePlaying = true; // matches the immediate .play() call above
function updateScreens(state) {
  attractBgEl.style.display     = state === 'IDLE'  ? 'block' : 'none';
  attractEl.style.display       = state === 'IDLE'  ? 'flex'  : 'none';
  attractLottieEl.style.display = state === 'IDLE'  ? 'block' : 'none';
  if (state === 'IDLE' && !attractLottiePlaying) { attractLottieAnim.play();  attractLottiePlaying = true;  }
  if (state !== 'IDLE' && attractLottiePlaying)  { attractLottieAnim.pause(); attractLottiePlaying = false; }
  const live = state === 'ARMING' || state === 'ACTIVE';
  feedCanvas.style.display  = live ? 'block' : 'none';
  topBandEl.style.display   = live ? 'block' : 'none';
  topLogoEl.style.display   = live ? 'block' : 'none';
  guideEl.style.display     = state === 'ARMING' ? 'flex' : 'none';
}

// Attract-loop ring: same 12 brand colors as the particle palette, laid out in
// a slowly rotating circle. Per-dot placement/size jitter is rolled once so
// the ring reads as organic rather than a perfectly even polygon; only the
// ring's overall radius "breathes" in and out — the dots themselves never
// change size, per the brief.
const ringJitterR = PALETTE.map(() => 0.85 + Math.random() * 0.3);
const ringJitterA = PALETTE.map(() => (Math.random() - 0.5) * 0.15);
const ringDotScale = PALETTE.map(() => 0.7 + Math.random() * 0.6);
const RING_ROTATE_S  = 25; // seconds per full rotation — slow, ambient
const RING_BREATHE_S = 7;  // seconds per breathe cycle

function drawAttractRing(W, H) {
  const cx = W / 2, cy = H / 2;
  const baseR = Math.min(W, H) * 0.30;
  const breathe = 1 + Math.sin((t / RING_BREATHE_S) * PI2) * 0.12;
  const rot = (t / RING_ROTATE_S) * PI2;
  const dotR = Math.min(W, H) * 0.014;
  for (let i = 0; i < PALETTE.length; i++) {
    const a = rot + (i / PALETTE.length) * PI2 + ringJitterA[i];
    const R = baseR * breathe * ringJitterR[i];
    const x = cx + Math.cos(a) * R;
    const y = cy + Math.sin(a) * R;
    const [r, g, b] = PALETTE[i];
    fxCtx.beginPath();
    fxCtx.arc(x, y, dotR * ringDotScale[i], 0, PI2);
    fxCtx.fillStyle = `rgb(${r},${g},${b})`;
    fxCtx.fill();
  }
}

// ─── Render loop ──────────────────────────────────────────────────────────────
let t = 0;
const PI2 = Math.PI * 2;
const DOMAIN_R  = 0.178 * 0.6 * 0.5; // finger-frame domain corner radius (half of the previous 60%)
// Small idle life: a tight float + a gentle size breathe. Both stay tiny on
// purpose — the anchor itself is what keeps the silhouette intact, so any
// added motion/size range here is a bonus wobble, not something that should
// be able to pull a particle noticeably off its sampled spot.
const FLOAT_R      = 5 * (Math.min(window.innerWidth, window.innerHeight) / 1080); // 5px wander radius
const PULSE_AMOUNT = 0.18; // size breathes ±18% around its base radius
const FRAME_MS = 1000 / 30; // 30fps cap
let lastFrameTime = 0;

function animate(now) {
  requestAnimationFrame(animate);
  if (now - lastFrameTime < FRAME_MS) return;
  lastFrameTime = now;
  t += 1 / 30;
  const W = fxCanvas.width, H = fxCanvas.height;
  fxCtx.clearRect(0, 0, W, H);

  // ── State machine ──────────────────────────────────────────────────────────
  if (frameRect) {
    clipRect = { ...frameRect };
    if (state === 'IDLE') {
      state = 'ARMING'; armStart = now;
    } else if (state === 'ARMING' && now - armStart >= ARM_MS) {
      state = 'ACTIVE';
      buildTargets(frameRect); lastBuild = now;
    } else if (state === 'ACTIVE' && now - lastBuild >= REBUILD_MS) {
      buildTargets(frameRect); lastBuild = now;
    }
  } else {
    if (state !== 'IDLE') {
      state = 'IDLE'; clipRect = null;
      for (let i = 0; i < N_cur; i++) pta[i] = 0; // instant off, no fade-out ramp
    }
  }

  updateGlass(frameRect, state === 'ARMING' || state === 'ACTIVE', state === 'ARMING');
  updateScreens(state);

  // ── Attract loop (idle) ─────────────────────────────────────────────────────
  if (state === 'IDLE') drawAttractRing(W, H);

  // ── Particles ─────────────────────────────────────────────────────────────
  if ((state === 'ARMING' || state === 'ACTIVE') && N_cur > 0) {
    blobCtx.clearRect(0, 0, W, H);

    for (let i = 0; i < N_cur; i++) {
      // No fade in or out — a particle is either fully opaque (pta === 1) or
      // not drawn at all, with nothing gradual in between.
      if (pta[i] !== 1) continue;

      // Each particle owns a fixed anchor (see the pool setup above) — a
      // rebuild only toggles it on/off, it never relocates. That's what
      // removes the flicker: there's no new target to jump to.
      // On top of that fixed anchor: a tight float (±5px) and a slow size
      // breathe, both small enough that the traced silhouette never suffers.
      const cx = pbx[i] + Math.cos(t * 0.5 + pph[i])  * FLOAT_R;
      const cy = pby[i] + Math.sin(t * 0.5 + pph2[i]) * FLOAT_R;
      const r  = prad[i] * (1 + Math.sin(t * 0.35 + pph[i]) * PULSE_AMOUNT);

      blobCtx.beginPath();
      blobCtx.arc(cx, cy, r, 0, PI2);
      blobCtx.fillStyle = `rgb(${pr[i]|0},${pg[i]|0},${pb[i]|0})`;
      blobCtx.fill();
    }

    // Composite to fx canvas clipped to domain
    fxCtx.save();
    if (clipRect) {
      const { x1, y1, x2, y2 } = clipRect;
      fxCtx.beginPath();
      fxCtx.roundRect(x1, y1, x2-x1, y2-y1, Math.min(W, H) * DOMAIN_R);
      fxCtx.clip();
    }
    fxCtx.drawImage(blob, 0, 0);
    fxCtx.restore();
  }

  // ── Scan line ──────────────────────────────────────────────────────────────
  if (frameRect && state === 'ACTIVE') {
    const { x1, y1, x2, y2 } = frameRect;
    const sy = y1 + (t * 40 % Math.max(1, y2 - y1));
    fxCtx.save();
    fxCtx.beginPath(); fxCtx.roundRect(x1, y1, x2-x1, y2-y1, Math.min(W, H) * DOMAIN_R); fxCtx.clip();
    const g = fxCtx.createLinearGradient(0, sy-22, 0, sy+22);
    g.addColorStop(0, 'rgba(180,220,255,0)'); g.addColorStop(.5, 'rgba(180,220,255,0.07)'); g.addColorStop(1, 'rgba(180,220,255,0)');
    fxCtx.fillStyle = g; fxCtx.fillRect(x1, sy-22, x2-x1, 44);
    fxCtx.restore();
  }

  // ── Vignette ───────────────────────────────────────────────────────────────
  const vg = fxCtx.createRadialGradient(W/2, H/2, H*0.3, W/2, H/2, H*0.9);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.38)');
  fxCtx.fillStyle = vg; fxCtx.fillRect(0, 0, W, H);
}

requestAnimationFrame(animate);
</script>

</body>
</html>
