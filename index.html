<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Depth Particle — MEP Interactive</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; font-family: 'Courier New', monospace; }
    canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; }

    /* ─── Two explicit per-display layouts ─────────────────────────────────
       Portrait (default below) targets the 9:16 vertical monitor/mobile
       case; landscape overrides it for the 16:9 general-web case. Kept as
       separate variable sets (not one shared vmin formula) so either can be
       retuned later without touching the other. */
    :root {
      /* Sized against the 9:16 wireframe's own ratios (logo/slogan/hand-guide
         measured relative to the ring square's width), not an arbitrary vmin
         guess — components read much bigger there than our old values. */
      --attract-logo-w: 50vmin;
      --attract-tag-w: 34vmin;
      --attract-guide-gap: 2.5vmin;
      --attract-guide-text-w: 50vmin;
      --attract-anim-w: 78vmin;
      --attract-guide-bottom: 4vmin;
      --ring-radius-ratio: 0.36;
      /* Small breathing room between the dot-ring square and the guide block
         below it — kept modest now that the guide block itself (bigger text
         + bigger hand-gesture strip) already reserves plenty of space, so
         adding much more here just reads as a big empty gap. */
      --attract-ring-gap: 1.5vmin;
      /* Height of the guide-text + hand-gesture block (2 text lines + gap +
         guide-animation strip + its own bottom margin + the ring gap above
         it), derived from the vars above so it always matches whatever either
         breakpoint sets them to. #attract (dot ring + logo + tagline) is
         reserved everything ABOVE this band — see #attract's `bottom` below
         — so the two blocks never overlap. */
      --attract-guide-total-h: calc(
        (var(--attract-guide-text-w) * 64 / 496) + var(--attract-guide-gap) +
        (var(--attract-anim-w) * 65 / 96) + var(--attract-guide-bottom) +
        var(--attract-ring-gap)
      );
    }
    @media (orientation: landscape) {
      :root {
        --attract-logo-w: 22vmin;
        --attract-tag-w: 19vmin;
        --attract-guide-gap: 2.2vmin;
        --attract-guide-text-w: 27vmin;
        --attract-anim-w: 46vmin;
        --attract-guide-bottom: 4vmin;
        --ring-radius-ratio: 0.30;
        /* Landscape wireframe has the guide block sitting right against the
           ring square, so no extra gap here. */
        --attract-ring-gap: 0vmin;
      }
    }

    #camError {
      position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
      color: rgba(255,120,120,0.75); font-size: 11px; letter-spacing: 0.08em;
      pointer-events: none; z-index: 20; display: none;
      font-family: -apple-system, 'Malgun Gothic', sans-serif;
    }
    video { display: none; }

    /* ─── Attract (idle/loop) screen ──────────────────────────────────────── */
    #attractBg { position: fixed; inset: 0; background: #000; z-index: 2; display: none; }
    #attract {
      position: fixed; top: 0; left: 0; right: 0; bottom: var(--attract-guide-total-h);
      z-index: 5; display: none;
      flex-direction: column; align-items: center; justify-content: center;
      pointer-events: none;
    }
    #attractLogo { width: var(--attract-logo-w); margin-bottom: 2.2vmin; }
    #attractLogo svg { width: 100%; height: auto; display: block; filter: invert(1); }
    #attractTag { width: var(--attract-tag-w); opacity: 0.55; }
    #attractTag svg { width: 100%; height: auto; display: block; }

    /* ─── Attract-screen hand-gesture guide — landing only, never shown once ──
       the person is actually in the live view (see updateScreens). ─────────── */
    #attractGuide {
      position: fixed; left: 50%; bottom: var(--attract-guide-bottom); transform: translateX(-50%);
      z-index: 5; display: none; flex-direction: column; align-items: center;
      gap: var(--attract-guide-gap);
      pointer-events: none;
    }
    #attractGuideText { width: var(--attract-guide-text-w); }
    #attractGuideText svg { width: 100%; height: auto; display: block; }
    #attractGuideAnim {
      width: var(--attract-anim-w); height: calc(var(--attract-anim-w) * 65 / 96);
      display: block; object-fit: cover; pointer-events: none;
    }

    /* ─── Persistent top logo + light band (arming/active) ───────────────── */
    #topBand {
      position: fixed; top: 0; left: 0; right: 0; height: 15vmin; z-index: 7;
      background: linear-gradient(to bottom, rgba(255,255,255,0.94), rgba(255,255,255,0));
      pointer-events: none; display: none;
    }
    #topLogo {
      position: fixed; top: 3.6vmin; left: 50%; transform: translateX(-50%);
      width: 13vmin; z-index: 9; display: none; pointer-events: none;
    }
    #topLogo svg { width: 100%; height: auto; display: block; }

    /* ─── Live-view gesture reminder (arming) ─────────────────────────────── */
    #guide {
      position: fixed; left: 50%; bottom: 9vmin; transform: translateX(-50%);
      z-index: 8; display: none; flex-direction: column; align-items: center; gap: 1.6vmin;
      padding: 2.4vmin 3.6vmin; border-radius: 2.2vmin;
      background: rgba(0,0,0,0.38); backdrop-filter: blur(8px);
      pointer-events: none;
    }
    #guideText { width: 27vmin; }
    #guideText svg { width: 100%; height: auto; display: block; }
    #guideIcon { width: 9vmin; color: #fff; }
    #guideIcon svg { width: 100%; height: auto; display: block; }

    /* ─── Capturing (brief transition after the open→fist gesture) ───────── */
    #capturing {
      position: fixed; inset: 0; z-index: 15; display: none;
      background: rgba(0,0,0,0.55); backdrop-filter: blur(4px);
      align-items: center; justify-content: center;
      pointer-events: none;
    }
    #capturingText {
      color: #fff; font-size: 2vmin; letter-spacing: 0.05em;
      font-family: -apple-system, 'Malgun Gothic', sans-serif;
    }

    /* ─── QR display (post-capture, 40s auto-return to IDLE) ─────────────── */
    #qrScreen {
      position: fixed; inset: 0; z-index: 15; display: none;
      background: #000;
      flex-direction: column; align-items: center; justify-content: center;
      gap: 3vmin;
      pointer-events: none;
    }
    #qrThumb {
      width: 46vmin; border-radius: 1.6vmin; overflow: hidden;
      box-shadow: 0 8px 40px rgba(0,0,0,0.4);
    }
    #qrThumb img { width: 100%; height: auto; display: block; }
    #qrCodeBox {
      width: 26vmin; height: 26vmin; background: #fff; border-radius: 1.2vmin;
      display: flex; align-items: center; justify-content: center; padding: 1.4vmin;
    }
    /* !important beats the inline width/height (e.g. "style="width:300px;
       height:300px"") that qrcode.js writes onto the canvas itself — a plain
       rule here loses to that inline style regardless of selector specificity,
       which let the QR code render at a fixed 300px and overflow this box. */
    #qrCodeBox canvas { position: static; width: 100% !important; height: 100% !important; }
    #qrText {
      color: rgba(255,255,255,0.85); font-size: 1.8vmin; text-align: center; line-height: 1.5;
      font-family: -apple-system, 'Malgun Gothic', sans-serif;
    }
    #qrGestureText {
      color: rgba(255,255,255,0.55); font-size: 1.5vmin; text-align: center; line-height: 1.5;
      font-family: -apple-system, 'Malgun Gothic', sans-serif;
    }
    #qrCountdown {
      color: rgba(255,255,255,0.45); font-size: 1.5vmin; letter-spacing: 0.08em;
      font-family: -apple-system, 'Malgun Gothic', sans-serif;
    }
  </style>
</head>
<body>

<canvas id="feed" style="z-index:1"></canvas>
<div id="attractBg"></div>
<canvas id="fx" style="z-index:4"></canvas>
<div id="topBand"></div>

<div id="attract">
  <div id="attractLogo"></div>
  <div id="attractTag"></div>
</div>

<div id="attractGuide">
  <div id="attractGuideText"></div>
  <video id="attractGuideAnim" src="guide-animation.webm" muted loop playsinline></video>
</div>

<div id="topLogo"></div>

<div id="guide">
  <div id="guideText"></div>
  <div id="guideIcon"></div>
</div>

<div id="capturing">
  <div id="capturingText">이미지 준비 중...</div>
</div>

<div id="qrScreen">
  <div id="qrThumb"><img id="qrThumbImg" alt=""></div>
  <div id="qrCodeBox"><canvas id="qrCanvas"></canvas></div>
  <div id="qrText">QR코드를 스캔해서<br>내 그림을 다운로드하세요</div>
  <div id="qrGestureText">카메라를 향해 손을 펼쳤다 다시 주먹을 쥐면<br>처음 화면으로 돌아갑니다</div>
  <div id="qrCountdown"></div>
</div>

<div id="camError">카메라 접근 실패 — 권한을 허용하세요</div>

<video id="wv" playsinline muted></video>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/hands.js" crossorigin="anonymous"></script>

const blob    = document.createElement('canvas');

// Read from the CSS custom property so the ring stays driven by the same
// per-orientation (16:9 web / 9:16 vertical) layout split as the rest of the
// attract screen, instead of a separate hardcoded value.
let ringRadiusRatio = 0.30;
// How much vertical space (in px) the guide-text + hand-gesture band reserves
// at the bottom of the screen — mirrors the `--attract-guide-total-h` calc()
// in CSS so the ring (drawn on canvas, not laid out by CSS) centers itself in
// the same reduced area #attract is constrained to, instead of full-screen
// center, which is what let the ring's dots drift down into the guide band.
let attractGuideReservedH = 0;
function resize() {
  const W = window.innerWidth, H = window.innerHeight;
  [feedCanvas, fxCanvas, blob].forEach(c => { c.width = W; c.height = H; });
  const cs = getComputedStyle(document.documentElement);
  const parsed = parseFloat(cs.getPropertyValue('--ring-radius-ratio'));
  if (!isNaN(parsed)) ringRadiusRatio = parsed;

  const vmin = Math.min(W, H) / 100;
  const guideTextW    = parseFloat(cs.getPropertyValue('--attract-guide-text-w')) || 0;
  const guideGap      = parseFloat(cs.getPropertyValue('--attract-guide-gap')) || 0;
  const animW         = parseFloat(cs.getPropertyValue('--attract-anim-w')) || 0;
  const guideBottom   = parseFloat(cs.getPropertyValue('--attract-guide-bottom')) || 0;
  const ringGap       = parseFloat(cs.getPropertyValue('--attract-ring-gap')) || 0;
  const animH = animW * 65 / 96;
  const guideTextH = guideTextW * 64 / 496;
  attractGuideReservedH = (guideTextH + guideGap + animH + guideBottom + ringGap) * vmin;
}
window.addEventListener('resize', resize);
resize();

// ─── Palette — from the reference brand color sheet ──────────────────────────
const PALETTE = [
  [253, 209, 231], // pale pink
  [250, 140, 238], // every Love (magenta pink)
  [201, 131, 247], // purple
  [124, 161, 251], // blue
  [ 0, 190, 252], // every Calm (cyan)
  [ 95, 250, 234], // turquoise
  [251, 130, 104], // coral
  [253, 181, 108], // orange
  [250, 251, 156], // every Warmth (pale yellow)
  [193, 250, 108], // lime
  [ 0, 218, 130], // every Bloom (green)
  [166, 244, 214], // mint
];

// Landing-screen dot ring only — a separate, more muted "Extended Palette 2"
// sheet, deliberately kept apart from PALETTE above so the particle effect's
// colors are untouched. Read visually off the reference slide (no pixel
// picker available), so nudge any of these if they're off.
const RING_PALETTE = [
  [ 22,  65,  46], // deep forest green
  [ 30, 122,  34], // every Love — medium green
  [111, 163,  36], // every Wonder — olive/lime green
  [173, 128,  20], // mustard gold
  [194,  63,  26], // every Calm — burnt orange
  [168,  30,  30], // deep brick red
  [ 43, 147, 172], // teal
  [ 36, 105, 163], // medium blue
  [ 26,  27, 108], // dark indigo navy
  [ 74,  29, 128], // violet
  [168,  31, 132], // every Bloom — magenta
  [108,  31,  58], // dark wine maroon
];

function pickColor() {
  const [r, g, b] = PALETTE[(Math.random() * PALETTE.length) | 0];
  const jitter = () => (Math.random() - 0.5) * 16;
  return {
    r: Math.min(255, Math.max(0, r + jitter())),
    g: Math.min(255, Math.max(0, g + jitter())),
    b: Math.min(255, Math.max(0, b + jitter())),
  };
}

// ─── Trail particle pool — ring buffer ────────────────────────────────────────
// No fixed grid of anchors tested against a silhouette mask anymore — a
// particle is spawned directly at a point along the tracked fingertip's path
// and just stays there (no on/off, no fade) until either the buffer wraps
// around and recycles its oldest slot, or the drawing is cleared entirely
// (see resetTrail, called on capture and on an abandoned/timed-out session).
const TRAIL_MAX = 10000; // bumped alongside the larger cluster size below, so the drawing still remembers roughly as much of the stroke before recycling
let   trailCount = 0; // how many slots are populated (caps at TRAIL_MAX)
let   trailWrite = 0; // next slot to write — wrapping here is what recycles the oldest point once full

const tx   = new Float32Array(TRAIL_MAX); // fixed screen position — never moves once placed
const ty   = new Float32Array(TRAIL_MAX);
const tph  = new Float32Array(TRAIL_MAX); // per-particle float/pulse phase — same idle life as before
const tph2 = new Float32Array(TRAIL_MAX);
const tr   = new Float32Array(TRAIL_MAX); // color
const tg   = new Float32Array(TRAIL_MAX);
const tb   = new Float32Array(TRAIL_MAX);
const trad = new Float32Array(TRAIL_MAX); // radius
// Random per-particle draw-depth (see the render loop): sorting by this
// instead of drawing in creation order is what makes stacking at overlaps
// random rather than "newest always on top."
const tlayer = new Float32Array(TRAIL_MAX);

// Each tracked point along the path spawns a small CLUSTER of particles
// (jittered around that point) instead of one — individual particles are
// smaller than a single old-style dot, so the cluster's footprint (not any
// one particle) is what determines the stroke's visual thickness. Raise
// TRAIL_CLUSTER_MIN/MAX to make the stroke thicker still; TRAIL_MAX above
// was bumped to match so the drawing keeps roughly the same history length
// per unit of path even with more particles going down per point.
const TRAIL_CLUSTER_MIN = 5;
const TRAIL_CLUSTER_MAX = 9;
const TRAIL_CLUSTER_JITTER = 20; // px at 1080-reference scale — widened a bit so the extra particles fill out a band instead of piling up on the same few pixels
function spawnTrailPoint(x, y, scale) {
  const count = TRAIL_CLUSTER_MIN + ((Math.random() * (TRAIL_CLUSTER_MAX - TRAIL_CLUSTER_MIN + 1)) | 0);
  for (let n = 0; n < count; n++) {
    const i = trailWrite;
    const col = pickColor();
    const a = Math.random() * Math.PI * 2;
    const r = Math.random() * TRAIL_CLUSTER_JITTER * scale;
    tx[i] = x + Math.cos(a) * r;
    ty[i] = y + Math.sin(a) * r;
    tph[i]  = Math.random() * Math.PI * 2;
    tph2[i] = Math.random() * Math.PI * 2;
    tr[i] = col.r; tg[i] = col.g; tb[i] = col.b;
    tlayer[i] = Math.random();
    // Smaller than the old single-dot range (was 6~25 base) since several
    // now land near the same spot — this is what keeps the cluster's
    // combined footprint, not each individual dot, doing the old dot's job.
    trad[i] = (3 + Math.random() * 8) * scale * (1 + Math.random() * 1.2);
    trailWrite = (trailWrite + 1) % TRAIL_MAX;
    trailCount = Math.min(trailCount + 1, TRAIL_MAX);
  }
}

// Distance-based spacing (a paused finger shouldn't keep piling up clusters
// on one spot) with segment interpolation (fast movement between two tracked
// frames shouldn't leave gaps) — standard digital-ink/brush technique.
const TRAIL_SPACING = 35; // px between spawned points, at the 1080-reference scale
let lastTrailX = null, lastTrailY = null;
function addTrailSegment(x1, y1, scale) {
  const spacing = TRAIL_SPACING * scale;
  if (lastTrailX === null) {
    spawnTrailPoint(x1, y1, scale);
    lastTrailX = x1; lastTrailY = y1;
    return;
  }
  const dx = x1 - lastTrailX, dy = y1 - lastTrailY;
  const dist = Math.hypot(dx, dy);
  if (dist < spacing) return;
  const steps = Math.floor(dist / spacing);
  for (let s = 1; s <= steps; s++) {
    spawnTrailPoint(lastTrailX + (dx * s) / steps, lastTrailY + (dy * s) / steps, scale);
  }
  lastTrailX = x1; lastTrailY = y1;
}

function resetTrail() {
  trailCount = 0; trailWrite = 0;
  lastTrailX = null; lastTrailY = null;
}

// ─── State ────────────────────────────────────────────────────────────────────
// IDLE (attract loop) -> ARMING (pointing gesture held) -> DRAWING (fingertip
// writes particles over the live camera feed) -> CAPTURING (open->fist
// gesture) -> QR_DISPLAY (40s countdown) -> back to IDLE.
let state    = 'IDLE';
let armStart = 0;
const ARM_MS = 600;

// Gesture readings — hands.onResults writes these on every MediaPipe
// callback; animate() reads them once per rendered frame. Same split as the
// old frameRect/buildTargets relationship: the detector doesn't decide
// anything, the render loop does, on its own clock.
let rawPointing = false; // single hand doing the "index only" pointing gesture
let rawOpenHand = false; // single hand fully open (all 4 fingers extended)
let rawFist     = false; // single hand closed into a fist
let fingerX = null, fingerY = null; // tracked fingertip screen position

// Debounced hand-shape signals — a leaky integrator + hysteresis per shape,
// same idea as the mask-alpha smoothing in the previous version
// (ALPHA_SMOOTH/ON/OFF): one misread MediaPipe frame can't start/stop a
// drawing session, misfire a capture, or misfire a clear-swipe by itself.
// Applied to all three raw shape reads (point/open/fist), not just pointing
// like the first version of this file did — that gap is why capture felt
// unreliable even though drawing itself felt fine.
const SHAPE_SMOOTH = 0.35;
const SHAPE_ON  = 0.6;
const SHAPE_OFF = 0.3;
let pointingConfidence = 0, pointingActive = false;
let openConfidence     = 0, openActive     = false;
let fistConfidence     = 0, fistActive     = false;

// Capture trigger: a fist only counts as "capture" if this same hand was seen
// fully open within the last OPEN_TO_FIST_WINDOW_MS — otherwise a naturally
// half-closed resting hand would trigger it constantly. Shortened from 1200ms
// and now also invalidated the moment pointing is confirmed (see animate()):
// without both, a clear-swipe (open) immediately followed by re-forming the
// pointing pose could pass a transient fist-like reading through the fingers'
// intermediate positions while the "was open recently" window was still open,
// misfiring a capture right after clearing.
const OPEN_TO_FIST_WINDOW_MS = 600;
let openSeenAt = -Infinity;
// A fist reading must hold for this long before it counts as a deliberate
// capture, not a one-frame blip passed through while the hand is mid-motion
// reconfiguring into some other pose.
const FIST_HOLD_MS = 150;
let fistActiveSince = 0;

// Clear gesture: an open hand swept sideways a large distance within a short
// window — mimics wiping a whiteboard clean. Distinct from pointing (single
// finger) and the capture fist, so it can't be triggered by accident.
const SWIPE_WINDOW_MS = 600;
const SWIPE_DIST_RATIO = 0.35; // fraction of screen width
let swipeStartX = null, swipeStartTime = 0;

// If the pointing hand goes missing mid-drawing for longer than this, treat
// the session as abandoned (clear the trail, return to IDLE) instead of
// waiting forever for a capture that isn't coming.
const DRAWING_TIMEOUT_MS = 6000;
let lastPointingSeenAt = 0;

const QR_DISPLAY_MS = 40000; // 40s, with a visible countdown — see updateScreens
let qrStart = 0;
let captureStarted = false; // guards startCapture() from firing more than once per CAPTURING state

// ─── Cover-fit crop ───────────────────────────────────────────────────────────
// The webcam's native frame (usually a fixed 16:9-ish landscape sensor
// resolution) rarely matches the display's aspect ratio — the exhibition TV
// is a 9:16 vertical panel. Stretching the frame to fill the canvas squashes
// the image non-uniformly, so instead we crop a centered window out of the
// source that matches the destination's aspect ratio (same idea as CSS
// `object-fit: cover`) and scale that window up to fill the canvas evenly.
// This inherently narrows the field of view on a portrait display (there's no
// way to show a landscape sensor's full width on a much narrower screen
// without cropping something) but keeps people's proportions correct.
function coverRect(srcW, srcH, dstW, dstH) {
  const scale = Math.max(dstW / srcW, dstH / srcH);
  const sw = dstW / scale, sh = dstH / scale;
  return { sx: (srcW - sw) / 2, sy: (srcH - sh) / 2, sw, sh };
}

// ─── Hands — single-hand gesture classifiers ─────────────────────────────────
// No SelfieSegmentation anymore — this interaction doesn't fill a silhouette,
// it draws along a tracked fingertip, so the body-mask model (and the CPU/GPU
// cost of running it every frame) simply isn't needed. The raw camera feed is
// still shown (drawn directly in the Camera onFrame callback below).
// Rotation/scale-invariant extension check: a finger is "extended" when its
// tip sits meaningfully farther from the wrist (landmark 0) than its own PIP
// joint does. Replaces an earlier plain tip.y-vs-pip.y comparison, which
// implicitly assumed an upright hand and got noisier the more the hand
// tilted or rotated — distance-from-wrist holds regardless of orientation,
// and the ratio (not an absolute distance) cancels out most of the scale
// change from the hand being closer to or farther from the camera.
function fingerExtended(lm, tip, pip) {
  const wrist = lm[0];
  const dTip = Math.hypot(lm[tip].x - wrist.x, lm[tip].y - wrist.y);
  const dPip = Math.hypot(lm[pip].x - wrist.x, lm[pip].y - wrist.y);
  return dTip > dPip * 1.1;
}
const NON_INDEX_TIPS = [[12,10],[16,14],[20,18]]; // middle, ring, pinky
const ALL_TIPS       = [[8,6], ...NON_INDEX_TIPS]; // + index
// Majority instead of unanimous agreement — one noisy landmark (ring/pinky
// are usually the least reliable) shouldn't be able to veto the whole read.
function isPointing(lm) {
  const curled = NON_INDEX_TIPS.filter(([tip, pip]) => !fingerExtended(lm, tip, pip)).length;
  return fingerExtended(lm, 8, 6) && curled >= 2;
}
function isOpenHand(lm) {
  return ALL_TIPS.filter(([tip, pip]) => fingerExtended(lm, tip, pip)).length >= 3;
}
function isFist(lm) {
  return ALL_TIPS.filter(([tip, pip]) => !fingerExtended(lm, tip, pip)).length >= 3;
}

const hands = new Hands({ locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/${f}` });
hands.setOptions({ maxNumHands:1, modelComplexity:1, minDetectionConfidence:0.6, minTrackingConfidence:0.5 });
hands.onResults(res => {
  const mhl = res.multiHandLandmarks;
  const W = fxCanvas.width, H = fxCanvas.height;
  if (!mhl || mhl.length === 0) {
    rawPointing = false; rawOpenHand = false; rawFist = false;
    fingerX = null; fingerY = null;
    return;
  }

  const lm = mhl[0]; // one hand only — see maxNumHands above
  // Landmarks are normalized [0,1] over the FULL uncropped source frame, so
  // they need the same cover-crop remap as the visible feed — otherwise the
  // tracked fingertip drifts away from where the hand actually appears on the
  // (now cropped) live view.
  const srcW = res.image.videoWidth || res.image.width;
  const srcH = res.image.videoHeight || res.image.height;
  const crop = coverRect(srcW, srcH, W, H);
  const mapX = nx => (1 - (nx * srcW - crop.sx) / crop.sw) * W;
  const mapY = ny => ((ny * srcH - crop.sy) / crop.sh) * H;

  rawPointing = isPointing(lm);
  rawOpenHand = isOpenHand(lm);
  rawFist     = isFist(lm);
  fingerX = mapX(lm[8].x);
  fingerY = mapY(lm[8].y);
});

// ─── Camera ───────────────────────────────────────────────────────────────────
const wv = document.getElementById('wv');
const cam = new Camera(wv, {
  onFrame: async () => {
    const W = feedCanvas.width, H = feedCanvas.height;
    const srcW = wv.videoWidth, srcH = wv.videoHeight;
    if (srcW && srcH) {
      const crop = coverRect(srcW, srcH, W, H);
      feedCtx.save();
      feedCtx.translate(W, 0); feedCtx.scale(-1, 1);
      feedCtx.drawImage(wv, crop.sx, crop.sy, crop.sw, crop.sh, 0, 0, W, H);
      feedCtx.restore();
    }
    await hands.send({ image: wv });
  },
  width: 1280, height: 720
});
cam.start().catch(() => { camErrorEl.style.display = 'block'; });

// ─── Exhibition screens ────────────────────────────────────────────────────────
// feed canvas is only meaningful once the person is actually being guided into
// or is inside the experience — attract is a stylized, camera-free screen.
// NOTE: the ARMING-state reminder (#guide / HAND_ICON_SVG / GUIDE_TEXT_SVG)
// still demonstrates the *old* two-hand framing gesture — only the landing
// screen's guide (#attractGuide) has been updated to the new pointing/fist
// motion graphics. Leave the ARMING reminder as-is unless asked to swap it too.
let attractAnimPlaying = true; // matches the immediate .play() call above
function updateScreens(state) {
  attractBgEl.style.display    = state === 'IDLE'  ? 'block' : 'none';
  attractEl.style.display      = state === 'IDLE'  ? 'flex'  : 'none';
  attractGuideEl.style.display = state === 'IDLE'  ? 'flex'  : 'none';
  if (state === 'IDLE' && !attractAnimPlaying) { attractGuideAnimEl.play();  attractAnimPlaying = true;  }
  if (state !== 'IDLE' && attractAnimPlaying)  { attractGuideAnimEl.pause(); attractAnimPlaying = false; }
  const live = state === 'ARMING' || state === 'DRAWING';
  feedCanvas.style.display  = live ? 'block' : 'none';
  topBandEl.style.display   = live ? 'block' : 'none';
  topLogoEl.style.display   = live ? 'block' : 'none';
  guideEl.style.display     = state === 'ARMING' ? 'flex' : 'none';
  capturingEl.style.display = state === 'CAPTURING' ? 'flex' : 'none';
  qrScreenEl.style.display  = state === 'QR_DISPLAY' ? 'flex' : 'none';
  if (state === 'QR_DISPLAY') {
    const remainMs = Math.max(0, QR_DISPLAY_MS - (performance.now() - qrStart));
    qrCountdownEl.textContent = Math.ceil(remainMs / 1000) + '초 후 초기화면으로 돌아갑니다';
  }
}

// Attract-loop ring: uses RING_PALETTE (its own muted 12-color set — see
// above), not the particle palette, laid out in a slowly rotating circle.
// Per-dot placement/size jitter is rolled once so the ring reads as organic
// rather than a perfectly even polygon; only the ring's overall radius
// "breathes" in and out — the dots themselves never change size, per the brief.
const ringJitterR = RING_PALETTE.map(() => 0.85 + Math.random() * 0.3);
const ringJitterA = RING_PALETTE.map(() => (Math.random() - 0.5) * 0.15);
const ringDotScale = RING_PALETTE.map(() => 0.7 + Math.random() * 0.6);
const RING_ROTATE_S  = 25; // seconds per full rotation — slow, ambient
const RING_BREATHE_S = 7;  // seconds per breathe cycle

function drawAttractRing(W, H) {
  // Center/size the ring within the space ABOVE the guide-text + hand-gesture
  // band (see attractGuideReservedH), not the full viewport — otherwise the
  // ring's dots can extend down into that band and overlap it.
  const availH = Math.max(H - attractGuideReservedH, H * 0.4);
  const cx = W / 2, cy = availH / 2;
  const baseR = Math.min(W, availH) * ringRadiusRatio;
  const breathe = 1 + Math.sin((t / RING_BREATHE_S) * PI2) * 0.12;
  const rot = (t / RING_ROTATE_S) * PI2;
  const dotR = Math.min(W, availH) * 0.014;
  for (let i = 0; i < RING_PALETTE.length; i++) {
    const a = rot + (i / RING_PALETTE.length) * PI2 + ringJitterA[i];
    const R = baseR * breathe * ringJitterR[i];
    const x = cx + Math.cos(a) * R;
    const y = cy + Math.sin(a) * R;
    const [r, g, b] = RING_PALETTE[i];
    fxCtx.beginPath();
    fxCtx.arc(x, y, dotR * ringDotScale[i], 0, PI2);
    fxCtx.fillStyle = `rgb(${r},${g},${b})`;
    fxCtx.fill();
  }
}

// ─── Capture: composite → JPEG → upload → QR ─────────────────────────────────
// TODO: fill these in once the Supabase project exists — Project Settings →
// API for the URL/anon key, Storage → New bucket for the bucket name (public,
// with an anon-INSERT policy). Until then, capture still works end-to-end;
// it just shows a placeholder QR instead of a real upload link, so the rest
// of the flow (drawing, gesture, countdown) is demoable without an account.
const SUPABASE_URL = 'https://ixekshjsugptjdiqcfdj.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml4ZWtzaGpzdWdwdGpkaXFjZmRqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ3ODkxMzcsImV4cCI6MjEwMDM2NTEzN30.NMvbHayuwrZu2w9Ne41FWznsaotWsnaCEqKcakq4UIM';
const SUPABASE_BUCKET = 'MEP_interactive_photos';
const supabaseClient = (SUPABASE_URL && SUPABASE_ANON_KEY)
  ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
  : null;

function compositeCapture() {
  const W = fxCanvas.width, H = fxCanvas.height;
  const out = document.createElement('canvas');
  out.width = W; out.height = H;
  const octx = out.getContext('2d');
  octx.drawImage(feedCanvas, 0, 0); // live camera behind
  octx.drawImage(fxCanvas, 0, 0);   // trail + vignette on top
  return out;
}

let lastThumbURL = null;
async function startCapture() {
  const canvas = compositeCapture();
  const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.85));
  if (lastThumbURL) URL.revokeObjectURL(lastThumbURL); // avoid leaking blob URLs over many visitors
  lastThumbURL = URL.createObjectURL(blob);
  qrThumbImgEl.src = lastThumbURL;

  let url = null;
  if (supabaseClient) {
    try {
      const path = `capture-${Date.now()}-${Math.random().toString(36).slice(2, 8)}.jpg`;
      const { error } = await supabaseClient.storage.from(SUPABASE_BUCKET)
        .upload(path, blob, { contentType: 'image/jpeg', upsert: false });
      if (!error) {
        url = supabaseClient.storage.from(SUPABASE_BUCKET).getPublicUrl(path).data.publicUrl;
      }
    } catch (e) { /* falls through to the placeholder QR below */ }
  }

  if (window.QRCode) {
    // Rendered well above #qrCodeBox's own CSS size (26vmin — up to ~560px on
    // a 4K portrait display) so the box's CSS scales the canvas DOWN rather
    // than the browser stretching a small bitmap UP into blur that could
    // start costing scanners modules at the QR's edges.
    QRCode.toCanvas(qrCanvasEl, url || 'Supabase가 아직 설정되지 않았습니다', { width: 800, margin: 1 }, () => {});
  }

  qrStart = performance.now();
  state = 'QR_DISPLAY';
  // The fist that just triggered this capture is very likely still held as
  // this async function resolves — without invalidating "seen open recently"
  // here (same idea as the pointing-confirmed reset above), that stale fist
  // would immediately satisfy the QR_DISPLAY return-to-IDLE gesture below and
  // bounce straight back out before the visitor even sees their QR code.
  openSeenAt = -Infinity;
}

// ─── Render loop ──────────────────────────────────────────────────────────────
let t = 0;
const PI2 = Math.PI * 2;
// Small idle life: a tight float + a gentle size breathe — same values as the
// previous silhouette-fill mode, just applied to a trail particle's fixed
// draw position (tx/ty) instead of a fixed anchor's projected position.
const FLOAT_R      = 5 * (Math.min(window.innerWidth, window.innerHeight) / 1080); // 5px wander radius
const PULSE_AMOUNT = 0.18; // size breathes ±18% around its base radius
const FRAME_MS = 1000 / 60; // 60fps cap
let lastFrameTime = 0;
let wasPointingActive = false;
// Reused every frame for the trail's draw-order sort (see below) instead of
// allocating a fresh array each time.
const trailOrder = new Uint16Array(TRAIL_MAX);

function animate(now) {
  requestAnimationFrame(animate);
  if (now - lastFrameTime < FRAME_MS) return;
  lastFrameTime = now;
  t += 1 / 30;
  const W = fxCanvas.width, H = fxCanvas.height;
  const scale = Math.min(W, H) / 1080;
  fxCtx.clearRect(0, 0, W, H);

  // ── Debounced hand-shape signals ────────────────────────────────────────────
  // Same leaky-integrator + hysteresis idea for all three raw reads, not just
  // pointing — see the declarations above for why.
  pointingConfidence += ((rawPointing ? 1 : 0) - pointingConfidence) * SHAPE_SMOOTH;
  pointingActive = pointingActive ? pointingConfidence >= SHAPE_OFF : pointingConfidence >= SHAPE_ON;
  openConfidence += ((rawOpenHand ? 1 : 0) - openConfidence) * SHAPE_SMOOTH;
  openActive = openActive ? openConfidence >= SHAPE_OFF : openConfidence >= SHAPE_ON;
  const wasFistActive = fistActive;
  fistConfidence += ((rawFist ? 1 : 0) - fistConfidence) * SHAPE_SMOOTH;
  fistActive = fistActive ? fistConfidence >= SHAPE_OFF : fistConfidence >= SHAPE_ON;
  if (fistActive && !wasFistActive) fistActiveSince = now;

  if (pointingActive && !wasPointingActive) { lastTrailX = null; lastTrailY = null; } // don't connect across a gap
  wasPointingActive = pointingActive;
  if (openActive) openSeenAt = now;
  // The moment pointing is confirmed, whatever "open recently" arming existed
  // is stale intent (they've moved on to drawing) — clearing it here is what
  // stops a swipe-then-point transition from still counting as open->fist a
  // frame or two later.
  if (pointingActive) openSeenAt = -Infinity;

  // Clear gesture: open hand, tracked position swept far sideways within
  // SWIPE_WINDOW_MS. Re-anchors its start point whenever the window lapses
  // without enough movement, so it keeps checking "the last little while"
  // rather than only ever measuring from the moment the hand first opened.
  if (openActive && fingerX !== null) {
    if (swipeStartX === null) {
      swipeStartX = fingerX; swipeStartTime = now;
    } else if (now - swipeStartTime < SWIPE_WINDOW_MS) {
      if (Math.abs(fingerX - swipeStartX) > W * SWIPE_DIST_RATIO) {
        if (state === 'DRAWING') resetTrail();
        swipeStartX = null;
      }
    } else {
      swipeStartX = fingerX; swipeStartTime = now;
    }
  } else {
    swipeStartX = null;
  }

  // ── State machine ──────────────────────────────────────────────────────────
  if (state === 'IDLE') {
    if (pointingActive) { state = 'ARMING'; armStart = now; }
  } else if (state === 'ARMING') {
    if (!pointingActive) {
      state = 'IDLE';
    } else if (now - armStart >= ARM_MS) {
      state = 'DRAWING'; lastPointingSeenAt = now;
    }
  } else if (state === 'DRAWING') {
    if (pointingActive) lastPointingSeenAt = now;
    if (now - lastPointingSeenAt > DRAWING_TIMEOUT_MS) {
      // Abandoned mid-drawing — clear it for the next visitor rather than
      // leaving a stale drawing waiting for a capture that isn't coming.
      resetTrail();
      state = 'IDLE';
    } else if (fistActive && (now - openSeenAt) < OPEN_TO_FIST_WINDOW_MS && (now - fistActiveSince) >= FIST_HOLD_MS) {
      state = 'CAPTURING';
      captureStarted = false; // fire startCapture() once, after this frame finishes painting — see below
    } else if (pointingActive && fingerX !== null && fingerY !== null) {
      addTrailSegment(fingerX, fingerY, scale);
    }
  } else if (state === 'QR_DISPLAY') {
    // Same open->fist gesture as the DRAWING capture trigger (see #qrGestureText
    // on the QR screen) lets a visitor skip the rest of the countdown and
    // return to IDLE immediately instead of waiting out QR_DISPLAY_MS.
    if (fistActive && (now - openSeenAt) < OPEN_TO_FIST_WINDOW_MS && (now - fistActiveSince) >= FIST_HOLD_MS) {
      resetTrail();
      state = 'IDLE';
    } else if (now - qrStart >= QR_DISPLAY_MS) {
      resetTrail();
      state = 'IDLE';
    }
  }
  // CAPTURING has no per-frame transition of its own — startCapture() moves
  // it to QR_DISPLAY asynchronously once the composite/upload/QR are ready.

  updateScreens(state);

  // ── Attract loop (idle) ─────────────────────────────────────────────────────
  if (state === 'IDLE') drawAttractRing(W, H);

  // ── Trail particles ────────────────────────────────────────────────────────
  if ((state === 'DRAWING' || state === 'CAPTURING') && trailCount > 0) {
    blobCtx.clearRect(0, 0, W, H);
    // Draw in an order sorted by each particle's fixed random tlayer, not by
    // index/creation order — otherwise whichever particle was drawn most
    // recently always paints over older ones at every overlap, so newer
    // strokes always look "in front." Since tlayer never changes once set,
    // this sort is stable frame to frame (no flicker), just not tied to
    // recency.
    for (let i = 0; i < trailCount; i++) trailOrder[i] = i;
    const order = trailOrder.subarray(0, trailCount);
    order.sort((a, b) => tlayer[a] - tlayer[b]);
    for (let k = 0; k < trailCount; k++) {
      const i = order[k];
      const cx = tx[i] + Math.cos(t * 0.5 + tph[i])  * FLOAT_R;
      const cy = ty[i] + Math.sin(t * 0.5 + tph2[i]) * FLOAT_R;
      const r  = trad[i] * (1 + Math.sin(t * 0.35 + tph[i]) * PULSE_AMOUNT);
      blobCtx.beginPath();
      blobCtx.arc(cx, cy, r, 0, PI2);
      blobCtx.fillStyle = `rgb(${tr[i]|0},${tg[i]|0},${tb[i]|0})`;
      blobCtx.fill();
    }
    fxCtx.drawImage(blob, 0, 0); // no domain clipping — the whole screen is fair game now
  }

  // ── Vignette ───────────────────────────────────────────────────────────────
  const vg = fxCtx.createRadialGradient(W/2, H/2, H*0.3, W/2, H/2, H*0.9);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.38)');
  fxCtx.fillStyle = vg; fxCtx.fillRect(0, 0, W, H);

  // Only now — after the trail + vignette are actually painted onto fxCanvas
  // for *this* frame — is it safe to snapshot it. Triggering this any earlier
  // in the function (e.g. right where the fist gesture is detected, above)
  // would composite a still-blank fxCanvas, since it's cleared at the top of
  // every animate() call and only repainted further down.
  if (state === 'CAPTURING' && !captureStarted) {
    captureStarted = true;
    startCapture();
  }
}

requestAnimationFrame(animate);
</script>
